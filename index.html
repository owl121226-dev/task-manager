<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Task Manager</title>
<style>
:root{--left:670px;--day:38px;--line:#dfe3e8;--light:#edf0f2;--blue:#2563eb;--bg:#f6f7f9;--row:48px}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#1f2937;background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer}
.top{height:62px;display:flex;align-items:center;gap:8px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}.brand{font-weight:700;margin-right:8px}.month{min-width:125px;text-align:center;font-weight:650}.spacer{flex:1}.btn{border:1px solid #d5dbe1;background:#fff;border-radius:8px;padding:8px 11px}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.filters{display:flex;gap:6px;overflow:auto;padding:9px 14px;background:#fff;border-bottom:1px solid var(--line)}.filter{white-space:nowrap;border:1px solid #d5dbe1;background:#fff;border-radius:999px;padding:6px 11px;color:#4b5563}.filter.active{background:#eaf2ff;border-color:#9ebcf5;color:#174ea6;font-weight:650}
.wrap{overflow:auto;height:calc(100vh - 112px);scroll-behavior:auto}.board{background:#fff;min-width:calc(var(--left) + var(--timelineW))}.head,.row{display:grid;grid-template-columns:var(--left) var(--timelineW)}.head{position:sticky;top:0;background:#fff;z-index:100;border-bottom:1px solid var(--line)}.left,.leftHead{position:sticky;left:0;background:#fff;border-right:1px solid var(--line);z-index:12}.leftHead{z-index:110}.leftGrid,.taskGrid{display:grid;grid-template-columns:1fr 92px 92px 118px;align-items:center}.leftGrid{height:58px}.leftGrid>div{height:100%;display:flex;align-items:center;padding:0 8px;border-right:1px solid #f0f2f4;font-size:12px;font-weight:650;color:#5f6772}.taskGrid{min-height:var(--row)}.taskGrid>div{padding:5px 8px;min-width:0}
.row{border-bottom:1px solid var(--light)}.groupBox{position:relative;background:#fff}.groupBox::after{content:"";position:absolute;inset:1px;border:2px solid #eef0f2;pointer-events:none;z-index:40}.groupBox .row:last-child{border-bottom:0}.groupLabel{height:var(--row);display:grid;grid-template-columns:var(--left) var(--timelineW);background:#fff}.groupLabelLeft{position:sticky;left:0;z-index:13;background:#fff;border-right:1px solid var(--line);display:grid;grid-template-columns:1fr 92px 92px 118px;align-items:center}.groupLabelLeft>div{height:100%;display:flex;align-items:center;padding:0 8px;border-right:1px solid #f0f2f4;font-size:12px;font-weight:650;color:#5f6772}.groupLabelRight{background:#fff}.row:hover .left{background:#fbfcfe}.row.sub .left{background:#fcfcfd}.row.done .name{text-decoration:line-through;color:#9aa1aa}.days{display:grid;grid-template-columns:repeat(var(--days),var(--day));background:#fff}.dh{height:58px;background:#fff;border-right:1px solid #eef0f2;text-align:center;display:flex;flex-direction:column;justify-content:center;font-size:11px;color:#667085}.dh b{font-size:13px;color:#374151}.weekend{background:#fafafa}.today{background:#fff3bf!important}.title{display:flex;align-items:center;gap:4px}.titleCheck{width:18px;height:18px;flex:none;margin:0 3px 0 2px}.drag{width:32px;height:29px;flex:none;color:#667085;cursor:grab;user-select:none;font-size:12px;font-weight:700;letter-spacing:0;display:inline-flex;align-items:center;justify-content:center;padding:0}.drag:active{cursor:grabbing}.toggle,.mini{border:0;background:transparent;border-radius:5px;color:#667085}.toggle{width:22px;height:25px}.toggle:hover,.mini:hover,.drag:hover{background:#eef0f2}.ghost{visibility:hidden}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:560}.row.sub .name{font-weight:450}.progress{margin-left:auto;font-size:11px;color:#737b87}
.date{min-height:36px;display:flex;align-items:center}.dateInput{width:100%;min-width:0;border:1px solid transparent;border-radius:6px;background:transparent;padding:6px 5px;font-size:12px;color:#374151;outline:none}.dateInput:hover{border-color:#dfe3e8;background:#fff}.dateInput:focus{border-color:#9ebcf5;background:#fff;box-shadow:0 0 0 2px #dbeafe}.dateInput::placeholder{color:#b0b7c0}.actions{display:flex;justify-content:flex-end;gap:2px}.mini{padding:6px 5px}.mini.del:hover{background:#fee2e2;color:#b91c1c}
.timeline{position:relative;min-height:var(--row);background-color:#fff;background-image:repeating-linear-gradient(to right,transparent 0 calc(var(--day) - 1px),#eef0f2 calc(var(--day) - 1px) var(--day)),linear-gradient(#fff3bf,#fff3bf),linear-gradient(to right,#fafafa 0 var(--day),transparent var(--day) var(--weekW)),linear-gradient(to right,#fafafa 0 var(--day),transparent var(--day) var(--weekW));background-size:var(--day) 100%,var(--day) 100%,var(--weekW) 100%,var(--weekW) 100%;background-position:0 0,var(--todayX) 0,var(--satX) 0,var(--sunX) 0;background-repeat:repeat-x,no-repeat,repeat-x,repeat-x}.bar{position:absolute;top:14px;height:20px;border-radius:5px;background:#7ba8f5;box-shadow:inset 0 0 0 1px #5c8bda55;z-index:3}.row.sub .bar{top:16px;height:16px;background:#aac7f8}.row.done .bar{opacity:.4}.row.dragging{opacity:.45}.row.before{box-shadow:inset 0 2px 0 var(--blue)}.row.after{box-shadow:inset 0 -2px 0 var(--blue)}
.empty{padding:45px;text-align:center;color:#737b87}.bottomSpacer{height:240px;background:#fff}.hint{font-size:12px;color:#667085;white-space:nowrap}dialog{width:min(520px,calc(100vw - 30px));border:1px solid #d8dde3;border-radius:12px;padding:0;box-shadow:0 24px 70px #0003}dialog::backdrop{background:#11182755}.dlgTitle{font-size:17px;font-weight:700;padding:16px 18px 6px}.form{display:grid;gap:12px;padding:10px 18px 18px}.field{display:grid;gap:5px}.field label{font-size:12px;font-weight:650;color:#59616c}.field input,.field select{border:1px solid #d8dde3;border-radius:8px;padding:9px 10px}.keepField{display:flex;align-items:center;gap:8px;font-size:12px;color:#59616c}.keepField input{width:17px;height:17px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dlgActions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}.notice{position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;border-radius:8px;padding:9px 12px;font-size:12px;opacity:0;transition:.2s;pointer-events:none;z-index:50}.notice.show{opacity:1}
@media(max-width:820px){:root{--left:548px}.brand,.hint{display:none}.leftGrid,.taskGrid{grid-template-columns:1fr 82px 82px 116px}.top{padding:0 9px}.month{min-width:105px}}
</style>
</head>
<body>
<header class="top"><div class="brand">Task Manager</div><button class="btn" id="prev">‹</button><div class="month" id="month"></div><button class="btn" id="next">›</button><button class="btn" id="now">今月</button><div class="spacer"></div><span class="hint">データはこのブラウザ内に保存</span><button class="btn" id="backup">バックアップ</button><button class="btn" id="restore">復元</button><input type="file" id="restoreFile" accept="application/json,.json" hidden><button class="btn primary" id="add">＋ タスク</button></header>
<nav class="filters" id="filters"><button class="filter active" data-f="all">すべて</button><button class="filter" data-f="today">今日</button><button class="filter" data-f="someday">時間がある時</button><button class="filter" data-f="completed">完了</button></nav>
<main class="wrap" id="wrap"><div class="board" id="board"><div class="head"><div class="leftHead"><div class="leftGrid"><div>タスク</div><div>開始日</div><div>締切日</div><div></div></div></div><div class="days" id="days"></div></div><div id="rows"></div><div class="bottomSpacer" aria-hidden="true"></div></div></main>
<dialog id="dlg"><div class="dlgTitle" id="dlgTitle">タスクを追加</div><form class="form" id="form"><input type="hidden" id="editId"><input type="hidden" id="parentId"><div class="field"><label>タスク名</label><input id="title" maxlength="120" required autocomplete="off"></div><div class="two"><div class="field"><label>開始日</label><input type="text" inputmode="numeric" placeholder="MM/DD または YYYY/MM/DD" maxlength="10" id="start"></div><div class="field"><label>締切日</label><input type="text" inputmode="numeric" placeholder="MM/DD または YYYY/MM/DD" maxlength="10" id="end"></div></div><div class="field"><label>分類</label><select id="category"><option value="top">タスク</option><option value="future">予定</option><option value="normal">経理</option><option value="someday">時間がある時</option></select></div><label class="keepField"><input type="checkbox" id="keepCompleted"><span id="keepLabel">完了しても完了タブへ移動しない</span></label><div class="dlgActions"><button type="button" class="btn" id="cancel">キャンセル</button><button class="btn primary">保存</button></div></form></dialog>
<div class="notice" id="notice"></div>
<script>
const $=id=>document.getElementById(id),KEY='task-manager-v1';
const state={tasks:[],collapsed:{},filter:'all',view:new Date(new Date().getFullYear(),new Date().getMonth(),1)};
let dragging=null,autoScrollFrame=null,autoScrollSpeed=0;
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x){state.tasks=(x.tasks||[]).map(t=>({...t,start:normalizeStored(t.start),end:normalizeStored(t.end)}));state.collapsed=x.collapsed||{};save()}}catch(e){}}
function save(){localStorage.setItem(KEY,JSON.stringify({tasks:state.tasks,collapsed:state.collapsed}))}
function backupData(){const payload={app:'task-manager',version:1,exportedAt:new Date().toISOString(),data:{tasks:state.tasks,collapsed:state.collapsed}};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a'),now=new Date(),stamp=`${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}-${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;a.href=URL.createObjectURL(blob);a.download=`task-manager-backup-${stamp}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);notice('バックアップを保存しました')}
async function restoreData(file){try{const raw=JSON.parse(await file.text()),data=raw?.data?.tasks?raw.data:raw;if(!data||!Array.isArray(data.tasks))throw new Error('tasks');if(!confirm(`バックアップから${data.tasks.length}件を復元します。現在のデータは上書きされます。よろしいですか？`))return;state.tasks=data.tasks.map(t=>({...t,start:normalizeStored(t.start),end:normalizeStored(t.end)}));state.collapsed=data.collapsed&&typeof data.collapsed==='object'?data.collapsed:{};save();render();notice('バックアップから復元しました')}catch(e){notice('バックアップファイルを読み込めませんでした')}finally{$('restoreFile').value=''}}
function iso(d){return d?`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`:''}
function date(s){if(!s)return null;const m=String(s).match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/);if(!m)return null;const y=Number(m[1]),mo=Number(m[2]),da=Number(m[3]),d=new Date(y,mo-1,da);return d.getFullYear()===y&&d.getMonth()===mo-1&&d.getDate()===da?d:null}
function normalizeStored(s){const d=date(s);return d?iso(d):''}
function short(s){const d=date(s);return d?`${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`:''}
function parseMD(v,base=''){v=(v||'').trim();if(!v)return '';if(/^\d{4}$/.test(v))v=v.slice(0,2)+'/'+v.slice(2);if(/^\d{8}$/.test(v))v=v.slice(0,4)+'/'+v.slice(4,6)+'/'+v.slice(6);let y,mo,da,m=v.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})$/);if(m){y=Number(m[1]);mo=Number(m[2]);da=Number(m[3])}else{m=v.match(/^(\d{1,2})\/(\d{1,2})$/);if(!m)return null;mo=Number(m[1]);da=Number(m[2]);const old=date(base);y=old?old.getFullYear():state.view.getFullYear()}const d=new Date(y,mo-1,da);if(d.getFullYear()!==y||d.getMonth()!==mo-1||d.getDate()!==da)return null;return iso(d)}
function day(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function same(a,b){return a&&b&&iso(a)===iso(b)}
function intersects(t,a,b){const s=date(t.start),e=date(t.end);if(!s&&!e)return false;const x=s||e,y=e||s;return x<=b&&y>=a}
function children(id){return state.tasks.filter(t=>(t.parentId||null)===(id||null)).sort((a,b)=>(a.order||0)-(b.order||0))}
function descendants(id){const out=[];for(const c of children(id))out.push(c,...descendants(c.id));return out}
function completionRoot(t,byId){let r=t,guard=0;while(r?.parentId&&guard++<50){const p=byId.get(r.parentId);if(!p)break;r=p}return r||t}
function movedToCompleted(t,byId){if(t.keepCompleted)return false;const root=completionRoot(t,byId);return !!root.completed&&!root.keepCompleted}
function match(t,byId){const now=day(new Date()),moved=movedToCompleted(t,byId);if(state.filter==='completed')return moved;if(moved)return false;if(state.filter==='all')return t.category!=='someday';if(state.filter==='someday')return t.category==='someday';if(state.filter==='today'){if(t.category==='someday')return false;const due=date(t.end)||date(t.start);return intersects(t,now,now)||(due&&due<=now)}return true}
function visible(){const out=[],byParent=new Map(),byId=new Map();for(const t of state.tasks){byId.set(t.id,t);const k=t.parentId||null;if(!byParent.has(k))byParent.set(k,[]);byParent.get(k).push(t)}for(const a of byParent.values())a.sort((x,y)=>(x.order||0)-(y.order||0));const kidsOf=id=>byParent.get(id||null)||[],memo=new Map();function hasMatch(t){if(memo.has(t.id))return memo.get(t.id);const v=match(t,byId)||kidsOf(t.id).some(hasMatch);memo.set(t.id,v);return v}function pushAll(t,depth){const kids=kidsOf(t.id);out.push({t,depth,kids});for(const c of kids)pushAll(c,depth+1)}function visit(t,depth){const kids=kidsOf(t.id),self=match(t,byId);if(state.filter==='today'){if(self){pushAll(t,depth);return}for(const c of kids)if(hasMatch(c))visit(c,depth);return}if(self||kids.some(hasMatch))out.push({t,depth,kids});for(const c of kids)if(hasMatch(c))visit(c,depth+1)}for(const r of kidsOf(null))if(hasMatch(r))visit(r,0);return out}
function notice(s){const n=$('notice');n.textContent=s;n.classList.add('show');clearTimeout(notice.t);notice.t=setTimeout(()=>n.classList.remove('show'),1200)}
function renderHead(){const y=state.view.getFullYear(),m=state.view.getMonth(),cnt=new Date(y,m+1,0).getDate(),today=day(new Date()),headKey=`${y}-${m}-${iso(today)}`,wd=['日','月','火','水','木','金','土'],dayPx=38,firstDow=new Date(y,m,1).getDay(),board=$('board');if(renderHead.key===headKey)return;renderHead.key=headKey;board.style.setProperty('--days',cnt);board.style.setProperty('--timelineW',`${cnt*dayPx}px`);board.style.setProperty('--weekW',`${7*dayPx}px`);board.style.setProperty('--satX',`${((6-firstDow+7)%7)*dayPx}px`);board.style.setProperty('--sunX',`${((7-firstDow)%7)*dayPx}px`);board.style.setProperty('--todayX',y===today.getFullYear()&&m===today.getMonth()?`${(today.getDate()-1)*dayPx}px`:'-9999px');$('month').textContent=`${y}年${m+1}月`;$('days').innerHTML='';for(let i=1;i<=cnt;i++){const d=new Date(y,m,i),el=document.createElement('div');el.className='dh'+((d.getDay()==0||d.getDay()==6)?' weekend':'')+(same(d,today)?' today':'');el.innerHTML=`<b>${i}</b><span>${wd[d.getDay()]}</span>`;$('days').appendChild(el)}}
function rootTask(t,byId){let r=t,guard=0;while(r?.parentId&&guard++<50){const p=byId?byId.get(r.parentId):state.tasks.find(x=>x.id===r.parentId);if(!p)break;r=p}return r||t}
function taskGroup(t,byId){const r=rootTask(t,byId);if(r.category==='top')return 'top';if(r.category==='future')return 'schedule';return 'accounting'}
function makeGroupLabel(text){const el=document.createElement('div');el.className='groupLabel';const left=document.createElement('div');left.className='groupLabelLeft';left.innerHTML=`<div>${text}</div><div></div><div></div><div></div>`;const right=document.createElement('div');right.className='groupLabelRight';el.append(left,right);return el}
function render(){renderHead();$('rows').innerHTML='';const list=visible();if(!list.length){$('rows').innerHTML='<div class="empty">該当するタスクはありません。</div>';return}if(state.filter==='all'){const buckets={top:[],schedule:[],accounting:[]},byId=new Map(state.tasks.map(t=>[t.id,t]));for(const x of list)buckets[taskGroup(x.t,byId)].push(x);const defs=[['top',''],['schedule','予定'],['accounting','経理']];for(const [key,label] of defs){if(label)$('rows').appendChild(makeGroupLabel(label));const items=buckets[key];if(!items.length)continue;const group=document.createElement('div');group.className='groupBox';for(const x of items)group.appendChild(row(x.t,x.depth,x.kids));$('rows').appendChild(group)}}else{for(const x of list)$('rows').appendChild(row(x.t,x.depth,x.kids))}}
function row(t,depth,kids){const r=document.createElement('div');r.className='row'+(depth?' sub':'')+(t.completed?' done':'');r.dataset.id=t.id;const l=document.createElement('div');l.className='left';const g=document.createElement('div');g.className='taskGrid';
const title=document.createElement('div');title.className='title';title.style.paddingLeft=`${depth*22}px`;
const cb=document.createElement('input');cb.className='titleCheck';cb.type='checkbox';cb.checked=!!t.completed;cb.title='完了';cb.onchange=()=>{t.completed=cb.checked;save();render()};
const drag=document.createElement('span');drag.className='drag';drag.textContent='⋮';drag.title='ドラッグして並び替え';drag.draggable=true;drag.ondragstart=e=>{dragging=t.id;r.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',t.id);startAutoScroll()};drag.ondragend=()=>{dragging=null;stopAutoScroll();document.querySelectorAll('.row').forEach(x=>x.classList.remove('dragging','before','after'))};
r.ondragover=e=>{if(!dragging||dragging===t.id)return;const src=state.tasks.find(x=>x.id===dragging);if(!src||(src.parentId||null)!==(t.parentId||null))return;e.preventDefault();const z=r.getBoundingClientRect(),before=e.clientY<z.top+z.height/2;r.classList.toggle('before',before);r.classList.toggle('after',!before)};
r.ondragleave=()=>r.classList.remove('before','after');r.ondrop=e=>{if(!dragging||dragging===t.id)return;const src=state.tasks.find(x=>x.id===dragging);if(!src||(src.parentId||null)!==(t.parentId||null))return;e.preventDefault();const z=r.getBoundingClientRect();reorder(dragging,t.id,e.clientY<z.top+z.height/2)};
const nm=document.createElement('span');nm.className='name';nm.textContent=t.title;nm.title=t.title;
title.append(drag,cb,nm);if(kids.length){const p=document.createElement('span');p.className='progress';p.textContent=`${kids.filter(x=>x.completed).length}/${kids.length}`;title.appendChild(p)}
const s=dateCell(t,'start'),e=dateCell(t,'end'),a=document.createElement('div');a.className='actions';
a.append(mini('＋','サブタスク追加',()=>openDlg(null,t.id)),mini('✎','編集',()=>openDlg(t.id)),mini('×','削除',()=>remove(t.id),'del'));
g.append(title,s,e,a);l.appendChild(g);r.append(l,timeline(t));return r}
function mini(txt,tip,fn,cls=''){const b=document.createElement('button');b.className='mini '+cls;b.textContent=txt;b.title=tip;b.onclick=fn;return b}
function dateCell(t,k){const d=document.createElement('div');d.className='date';const i=document.createElement('input');i.className='dateInput';i.type='text';i.inputMode='numeric';i.maxLength=10;i.placeholder='MM/DD';i.value=short(t[k]);i.title='MM/DD または YYYY/MM/DDで直接入力';const commit=()=>{const parsed=parseMD(i.value,t[k]);if(parsed===null){notice('日付はMM/DDまたはYYYY/MM/DDで入力してください');i.value=short(t[k]);return}if(parsed===t[k]){i.value=short(t[k]);return}t[k]=parsed;if(t.start&&t.end&&t.end<t.start){if(k==='start')t.end=t.start;else t.start=t.end}save();render()};i.onblur=commit;i.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();i.blur()}else if(e.key==='Escape'){i.value=short(t[k]);i.blur()}};d.appendChild(i);return d}
function timeline(t){const y=state.view.getFullYear(),m=state.view.getMonth(),cnt=new Date(y,m+1,0).getDate(),tl=document.createElement('div');tl.className='timeline';const s=date(t.start),e=date(t.end);if(s||e){const a=s||e,b=e||s,ms=new Date(y,m,1),me=new Date(y,m,cnt);if(a<=me&&b>=ms){const vs=a<ms?ms:a,ve=b>me?me:b,first=vs.getDate()-1,len=Math.floor((ve-vs)/86400000)+1,bar=document.createElement('div');bar.className='bar';bar.style.left=`calc(${first} * var(--day) + 3px)`;bar.style.width=`calc(${len} * var(--day) - 6px)`;bar.title=`${t.title}: ${short(t.start||t.end)} ～ ${short(t.end||t.start)}`;tl.appendChild(bar)}}return tl}
function openDlg(id=null,pid=null){const t=id?state.tasks.find(x=>x.id===id):null,p=pid?state.tasks.find(x=>x.id===pid):null,isSub=!!(pid||t?.parentId);$('editId').value=id||'';$('parentId').value=pid||'';$('dlgTitle').textContent=t?'タスクを編集':pid?'サブタスクを追加':'タスクを追加';$('title').value=t?.title||'';$('start').value=short(t?.start||'');$('end').value=short(t?.end||'');$('category').value=t?.category||p?.category||'top';$('keepCompleted').checked=!!t?.keepCompleted;$('keepLabel').textContent=isSub?'親タスク完了後も完了タブへ移動しない':'完了しても完了タブへ移動しない';$('dlg').showModal();setTimeout(()=>$('title').focus(),20)}
function nextOrder(pid){return Math.max(0,...children(pid).map(x=>x.order||0))+10}
function reorder(srcId,targetId,before){const src=state.tasks.find(x=>x.id===srcId),target=state.tasks.find(x=>x.id===targetId);if(!src||!target||(src.parentId||null)!==(target.parentId||null))return;const pid=src.parentId||null,a=children(pid),from=a.findIndex(x=>x.id===srcId);a.splice(from,1);let to=a.findIndex(x=>x.id===targetId);if(!before)to++;a.splice(to,0,src);a.forEach((x,i)=>x.order=(i+1)*10);save();render();notice('並び替えました')}
function remove(id){const t=state.tasks.find(x=>x.id===id),kids=descendants(id);if(!t||!confirm(kids.length?`「${t.title}」とサブタスク${kids.length}件を削除しますか？`:`「${t.title}」を削除しますか？`))return;const ids=new Set([id,...kids.map(x=>x.id)]);state.tasks=state.tasks.filter(x=>!ids.has(x.id));save();render();notice('削除しました')}
function startAutoScroll(){if(autoScrollFrame)return;const tick=()=>{if(!dragging){autoScrollFrame=null;return}if(autoScrollSpeed)$('wrap').scrollTop+=autoScrollSpeed;autoScrollFrame=requestAnimationFrame(tick)};autoScrollFrame=requestAnimationFrame(tick)}
function stopAutoScroll(){autoScrollSpeed=0;if(autoScrollFrame){cancelAnimationFrame(autoScrollFrame);autoScrollFrame=null}}
document.addEventListener('dragover',e=>{if(!dragging)return;const w=$('wrap'),r=w.getBoundingClientRect(),zone=Math.min(100,r.height*.18);if(e.clientY<r.top+zone){const ratio=Math.max(0,Math.min(1,(r.top+zone-e.clientY)/zone));autoScrollSpeed=-(4+18*ratio)}else if(e.clientY>r.bottom-zone){const ratio=Math.max(0,Math.min(1,(e.clientY-(r.bottom-zone))/zone));autoScrollSpeed=4+18*ratio}else autoScrollSpeed=0});
document.addEventListener('drop',()=>stopAutoScroll());
$('form').onsubmit=e=>{e.preventDefault();const id=$('editId').value||null,pid=$('parentId').value||null,title=$('title').value.trim(),old=id?state.tasks.find(x=>x.id===id):null,p=pid?state.tasks.find(x=>x.id===pid):null;let start=parseMD($('start').value,old?.start||p?.start||''),end=parseMD($('end').value,old?.end||p?.end||'');if(!title)return;if(start===null||end===null){notice('日付はMM/DDまたはYYYY/MM/DDで入力してください');return}if(start&&end&&end<start)[start,end]=[end,start];if(id){Object.assign(old,{title,start,end,category:$('category').value,keepCompleted:$('keepCompleted').checked})}else{const task={id:uid(),title,start,end,completed:false,parentId:pid,category:$('category').value,keepCompleted:$('keepCompleted').checked,order:nextOrder(pid)};state.tasks.push(task)}save();$('dlg').close();render();notice(id?'更新しました':'追加しました')};
$('cancel').onclick=()=>$('dlg').close();$('backup').onclick=backupData;$('restore').onclick=()=>$('restoreFile').click();$('restoreFile').onchange=e=>{const f=e.target.files?.[0];if(f)restoreData(f)};$('add').onclick=()=>openDlg();$('prev').onclick=()=>{state.view=new Date(state.view.getFullYear(),state.view.getMonth()-1,1);render()};$('next').onclick=()=>{state.view=new Date(state.view.getFullYear(),state.view.getMonth()+1,1);render()};$('now').onclick=()=>{state.view=new Date(new Date().getFullYear(),new Date().getMonth(),1);render();scrollToday()};$('filters').onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;state.filter=b.dataset.f;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()};
function scrollToday(){if(state.view.getFullYear()!=new Date().getFullYear()||state.view.getMonth()!=new Date().getMonth())return;$('wrap').scrollLeft=Math.max(0,(new Date().getDate()-5)*38)}
load();render();setTimeout(scrollToday,20);
</script>
