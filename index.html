<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Task Manager</title>
<style>
:root{--left:600px;--day:38px;--line:#e2e6ea;--bg:#f6f7f9;--blue:#2563eb;--today:#fff3bf}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#1f2937;background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer}.top{height:62px;display:flex;align-items:center;gap:8px;padding:0 16px;background:white;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}.brand{font-weight:700;margin-right:8px}.month{min-width:125px;text-align:center;font-weight:650}.spacer{flex:1}.btn{border:1px solid #d5dbe1;background:white;border-radius:8px;padding:8px 11px}.btn.primary{background:var(--blue);color:white;border-color:var(--blue)}.filters{display:flex;gap:6px;overflow:auto;padding:9px 14px;background:white;border-bottom:1px solid var(--line)}.filter{white-space:nowrap;border:1px solid #d5dbe1;background:white;border-radius:999px;padding:6px 11px;color:#4b5563}.filter.active{background:#eaf2ff;border-color:#9ebcf5;color:#174ea6;font-weight:650}.wrap{overflow:auto;height:calc(100vh - 112px)}.board{background:white;min-width:calc(var(--left) + var(--days)*var(--day))}.head,.row{display:grid;grid-template-columns:var(--left) calc(var(--days)*var(--day))}.head{position:sticky;top:0;background:white;z-index:20;border-bottom:1px solid var(--line)}.left,.leftHead{position:sticky;left:0;background:white;border-right:1px solid var(--line);z-index:12}.leftHead{z-index:24}.leftGrid,.taskGrid{display:grid;grid-template-columns:44px 1fr 108px 108px 92px;align-items:center}.leftGrid{height:58px}.leftGrid>div{height:100%;display:flex;align-items:center;padding:0 8px;border-right:1px solid #f0f2f4;font-size:12px;font-weight:650;color:#5f6772}.taskGrid{min-height:48px}.taskGrid>div{padding:5px 8px;min-width:0}.row{border-bottom:1px solid #edf0f2}.row:hover .left{background:#fbfcfe}.row.sub .left{background:#fcfcfd}.row.done .name{text-decoration:line-through;color:#9aa1aa}.days,.timeline{display:grid;grid-template-columns:repeat(var(--days),var(--day))}.dh{height:58px;border-right:1px solid #eef0f2;text-align:center;display:flex;flex-direction:column;justify-content:center;font-size:11px;color:#667085}.dh b{font-size:13px;color:#374151}.weekend{background:#fafafa}.today{background:var(--today)!important}.check{text-align:center}.check input{width:18px;height:18px}.title{display:flex;align-items:center;gap:4px}.indent{width:calc(var(--depth)*22px);flex:none}.toggle,.mini{border:0;background:transparent;border-radius:5px;color:#667085}.toggle{width:22px;height:25px}.toggle:hover,.mini:hover{background:#eef0f2}.ghost{visibility:hidden}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:560}.row.sub .name{font-weight:450}.progress{margin-left:auto;font-size:11px;color:#737b87}.date input{width:100%;border:1px solid transparent;background:transparent;padding:4px 1px;border-radius:5px;font-size:12px}.date input:hover,.date input:focus{border-color:#d8dde3;background:white;outline:0}.actions{display:flex;justify-content:flex-end;gap:2px}.mini{padding:6px}.mini.del:hover{background:#fee2e2;color:#b91c1c}.timeline{position:relative;min-height:48px}.cell{min-height:48px;border-right:1px solid #eef0f2}.bar{position:absolute;top:14px;height:20px;border-radius:5px;background:#7ba8f5;box-shadow:inset 0 0 0 1px #5c8bda55;z-index:3}.row.sub .bar{top:16px;height:16px;background:#aac7f8}.row.done .bar{opacity:.4}.empty{padding:45px;text-align:center;color:#737b87}.hint{font-size:12px;color:#667085;white-space:nowrap}dialog{width:min(520px,calc(100vw - 30px));border:1px solid #d8dde3;border-radius:12px;padding:0;box-shadow:0 24px 70px #0003}dialog::backdrop{background:#11182755}.dlgTitle{font-size:17px;font-weight:700;padding:16px 18px 6px}.form{display:grid;gap:12px;padding:10px 18px 18px}.field{display:grid;gap:5px}.field label{font-size:12px;font-weight:650;color:#59616c}.field input,.field select{border:1px solid #d8dde3;border-radius:8px;padding:9px 10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dlgActions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}@media(max-width:820px){:root{--left:520px}.brand{display:none}.leftGrid,.taskGrid{grid-template-columns:40px 1fr 98px 98px 78px}.top{padding:0 9px}.month{min-width:105px}}
</style>
</head>
<body>
<header class="top">
<div class="brand">Task Manager</div>
<button class="btn" id="prev">‹</button><div class="month" id="month"></div><button class="btn" id="next">›</button><button class="btn" id="now">今月</button>
<div class="spacer"></div><span class="hint">データはこのブラウザ内に保存</span><button class="btn primary" id="add">＋ タスク</button>
</header>
<nav class="filters" id="filters">
<button class="filter active" data-f="all">すべて</button><button class="filter" data-f="today">今日</button><button class="filter" data-f="week">今週</button><button class="filter" data-f="next">来週</button><button class="filter" data-f="later">今後の予定</button><button class="filter" data-f="someday">時間がある時</button><button class="filter" data-f="open">未完了</button>
</nav>
<main class="wrap" id="wrap"><div class="board" id="board">
<div class="head"><div class="leftHead"><div class="leftGrid"><div>完了</div><div>タスク</div><div>開始日</div><div>締切日</div><div></div></div></div><div class="days" id="days"></div></div>
<div id="rows"></div></div></main>
<dialog id="dlg"><div class="dlgTitle" id="dlgTitle">タスクを追加</div><form class="form" id="form">
<input type="hidden" id="editId"><input type="hidden" id="parentId">
<div class="field"><label>タスク名</label><input id="title" maxlength="120" required autocomplete="off"></div>
<div class="two"><div class="field"><label>開始日</label><input type="date" id="start"></div><div class="field"><label>締切日</label><input type="date" id="end"></div></div>
<div class="field"><label>分類</label><select id="category"><option value="normal">通常</option><option value="someday">時間がある時</option></select></div>
<div class="dlgActions"><button type="button" class="btn" id="cancel">キャンセル</button><button class="btn primary">保存</button></div>
</form></dialog>
<script>
const $=id=>document.getElementById(id),KEY='task-manager-v1';
const state={tasks:[],collapsed:{},filter:'all',view:new Date(new Date().getFullYear(),new Date().getMonth(),1)};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x){state.tasks=x.tasks||[];state.collapsed=x.collapsed||{}}}catch(e){}}
function save(){localStorage.setItem(KEY,JSON.stringify({tasks:state.tasks,collapsed:state.collapsed}))}
function iso(d){return d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`:''}
function date(s){if(!s)return null;const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function day(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function monday(d){d=day(d);const n=(d.getDay()+6)%7;d.setDate(d.getDate()-n);return d}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function same(a,b){return a&&b&&iso(a)===iso(b)}
function inRange(d,a,b){return d&&d>=a&&d<=b}
function intersects(t,a,b){const s=date(t.start),e=date(t.end);if(!s&&!e)return false;const x=s||e,y=e||s;return x<=b&&y>=a}
function children(id){return state.tasks.filter(t=>(t.parentId||null)===(id||null)).sort((a,b)=>(a.order||0)-(b.order||0))}
function descendants(id){const out=[];for(const c of children(id)){out.push(c,...descendants(c.id))}return out}
function match(t){const now=day(new Date()),wk=monday(now);if(state.filter==='all')return true;if(state.filter==='open')return !t.completed;if(state.filter==='someday')return t.category==='someday';if(t.category==='someday')return false;if(state.filter==='today')return intersects(t,now,now);if(state.filter==='week')return intersects(t,wk,addDays(wk,6));if(state.filter==='next')return intersects(t,addDays(wk,7),addDays(wk,13));if(state.filter==='later')return (date(t.end)||date(t.start)||new Date(0))>addDays(wk,13);return true}
function visible(){const out=[];function visit(t,depth){const kids=children(t.id),show=match(t)||descendants(t.id).some(match);if(show)out.push({t,depth,kids});if(!state.collapsed[t.id])for(const c of kids){if(state.filter==='all'||match(c)||descendants(c.id).some(match))visit(c,depth+1)}}for(const r of children(null))visit(r,0);return out}
function renderHead(){const y=state.view.getFullYear(),m=state.view.getMonth(),cnt=new Date(y,m+1,0).getDate(),today=day(new Date()),wd=['日','月','火','水','木','金','土'];$('board').style.setProperty('--days',cnt);$('month').textContent=`${y}年${m+1}月`;$('days').innerHTML='';for(let i=1;i<=cnt;i++){const d=new Date(y,m,i),el=document.createElement('div');el.className='dh'+((d.getDay()==0||d.getDay()==6)?' weekend':'')+(same(d,today)?' today':'');el.innerHTML=`<b>${i}</b><span>${wd[d.getDay()]}</span>`;$('days').appendChild(el)}}
function render(){renderHead();$('rows').innerHTML='';const list=visible();if(!list.length){$('rows').innerHTML='<div class="empty">該当するタスクはありません。</div>';return}for(const x of list)$('rows').appendChild(row(x.t,x.depth,x.kids))}
function row(t,depth,kids){const r=document.createElement('div');r.className='row'+(depth?' sub':'')+(t.completed?' done':'');const l=document.createElement('div');l.className='left';const g=document.createElement('div');g.className='taskGrid';const c=document.createElement('div');c.className='check';const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!t.completed;cb.onchange=()=>{t.completed=cb.checked;save();render()};c.appendChild(cb);const title=document.createElement('div');title.className='title';const ind=document.createElement('span');ind.className='indent';ind.style.setProperty('--depth',depth);const tog=document.createElement('button');tog.className='toggle'+(kids.length?'':' ghost');tog.textContent=state.collapsed[t.id]?'▸':'▾';tog.onclick=()=>{state.collapsed[t.id]=!state.collapsed[t.id];save();render()};const nm=document.createElement('span');nm.className='name';nm.textContent=t.title;nm.title=t.title;title.append(ind,tog,nm);if(kids.length){const p=document.createElement('span');p.className='progress';p.textContent=`${kids.filter(x=>x.completed).length}/${kids.length}`;title.appendChild(p)}const s=dateInput(t,'start'),e=dateInput(t,'end');const a=document.createElement('div');a.className='actions';a.append(mini('＋','サブタスク追加',()=>openDlg(null,t.id)),mini('✎','編集',()=>openDlg(t.id)),mini('×','削除',()=>remove(t.id),'del'));g.append(c,title,s,e,a);l.appendChild(g);r.append(l,timeline(t));return r}
function mini(txt,tip,fn,cls=''){const b=document.createElement('button');b.className='mini '+cls;b.textContent=txt;b.title=tip;b.onclick=fn;return b}
function dateInput(t,k){const d=document.createElement('div');d.className='date';const i=document.createElement('input');i.type='date';i.value=t[k]||'';i.onchange=()=>{t[k]=i.value;if(t.start&&t.end&&t.end<t.start){if(k==='start')t.end=t.start;else t.start=t.end}save();render()};d.appendChild(i);return d}
function timeline(t){const y=state.view.getFullYear(),m=state.view.getMonth(),cnt=new Date(y,m+1,0).getDate(),tl=document.createElement('div');tl.className='timeline';const today=day(new Date());for(let i=1;i<=cnt;i++){const d=new Date(y,m,i),c=document.createElement('div');c.className='cell'+((d.getDay()==0||d.getDay()==6)?' weekend':'')+(same(d,today)?' today':'');tl.appendChild(c)}const s=date(t.start),e=date(t.end);if(s||e){const a=s||e,b=e||s,ms=new Date(y,m,1),me=new Date(y,m,cnt);if(a<=me&&b>=ms){const vs=a<ms?ms:a,ve=b>me?me:b,first=vs.getDate()-1,len=Math.floor((ve-vs)/86400000)+1,bar=document.createElement('div');bar.className='bar';bar.style.left=`calc(${first} * var(--day) + 3px)`;bar.style.width=`calc(${len} * var(--day) - 6px)`;bar.title=`${t.title}: ${t.start||t.end} ～ ${t.end||t.start}`;tl.appendChild(bar)}}return tl}
function openDlg(id=null,pid=null){const t=id?state.tasks.find(x=>x.id===id):null,p=pid?state.tasks.find(x=>x.id===pid):null;$('editId').value=id||'';$('parentId').value=pid||'';$('dlgTitle').textContent=t?'タスクを編集':pid?'サブタスクを追加':'タスクを追加';$('title').value=t?.title||'';$('start').value=t?.start||p?.start||'';$('end').value=t?.end||p?.end||'';$('category').value=t?.category||p?.category||'normal';$('dlg').showModal();setTimeout(()=>$('title').focus(),20)}
function nextOrder(pid){return Math.max(0,...children(pid).map(x=>x.order||0))+10}
function remove(id){const t=state.tasks.find(x=>x.id===id),kids=descendants(id);if(!confirm(kids.length?`「${t.title}」とサブタスク${kids.length}件を削除しますか？`:`「${t.title}」を削除しますか？`))return;const ids=new Set([id,...kids.map(x=>x.id)]);state.tasks=state.tasks.filter(x=>!ids.has(x.id));save();render()}
$('form').onsubmit=e=>{e.preventDefault();const id=$('editId').value||null,pid=$('parentId').value||null,title=$('title').value.trim();if(!title)return;let start=$('start').value,end=$('end').value;if(start&&end&&end<start)[start,end]=[end,start];if(id){Object.assign(state.tasks.find(x=>x.id===id),{title,start,end,category:$('category').value})}else{state.tasks.push({id:uid(),title,start,end,completed:false,parentId:pid,category:$('category').value,order:nextOrder(pid)});if(pid)state.collapsed[pid]=false}save();$('dlg').close();render()};
$('cancel').onclick=()=>$('dlg').close();$('add').onclick=()=>openDlg();$('prev').onclick=()=>{state.view=new Date(state.view.getFullYear(),state.view.getMonth()-1,1);render()};$('next').onclick=()=>{state.view=new Date(state.view.getFullYear(),state.view.getMonth()+1,1);render()};$('now').onclick=()=>{state.view=new Date(new Date().getFullYear(),new Date().getMonth(),1);render();scrollToday()};$('filters').onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;state.filter=b.dataset.f;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()};function scrollToday(){if(state.view.getFullYear()!=new Date().getFullYear()||state.view.getMonth()!=new Date().getMonth())return;$('wrap').scrollLeft=Math.max(0,(new Date().getDate()-5)*38)}load();render();setTimeout(scrollToday,20);
</script>
</body>
</html>
