name: Add backup and restore
on:
  push:
    paths:
      - '.github/workflows/add-backup-restore.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add backup and restore controls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old_header='<div class="spacer"></div><span class="hint">データはこのブラウザ内に保存</span><button class="btn primary" id="add">＋ タスク</button></header>'
          new_header='<div class="spacer"></div><span class="hint">データはこのブラウザ内に保存</span><button class="btn" id="backup">バックアップ</button><button class="btn" id="restore">復元</button><input type="file" id="restoreFile" accept="application/json,.json" hidden><button class="btn primary" id="add">＋ タスク</button></header>'
          assert old_header in s
          s=s.replace(old_header,new_header,1)
          old_save="function save(){localStorage.setItem(KEY,JSON.stringify({tasks:state.tasks,collapsed:state.collapsed}))}"
          new_save="function save(){localStorage.setItem(KEY,JSON.stringify({tasks:state.tasks,collapsed:state.collapsed}))}\nfunction backupData(){const payload={app:'task-manager',version:1,exportedAt:new Date().toISOString(),data:{tasks:state.tasks,collapsed:state.collapsed}};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a'),now=new Date(),stamp=`${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}-${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;a.href=URL.createObjectURL(blob);a.download=`task-manager-backup-${stamp}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);notice('バックアップを保存しました')}\nasync function restoreData(file){try{const raw=JSON.parse(await file.text()),data=raw?.data?.tasks?raw.data:raw;if(!data||!Array.isArray(data.tasks))throw new Error('tasks');if(!confirm(`バックアップから${data.tasks.length}件を復元します。現在のデータは上書きされます。よろしいですか？`))return;state.tasks=data.tasks.map(t=>({...t,start:normalizeStored(t.start),end:normalizeStored(t.end)}));state.collapsed=data.collapsed&&typeof data.collapsed==='object'?data.collapsed:{};save();render();notice('バックアップから復元しました')}catch(e){notice('バックアップファイルを読み込めませんでした')}finally{$('restoreFile').value=''}}"
          assert old_save in s
          s=s.replace(old_save,new_save,1)
          marker="$('cancel').onclick=()=>$('dlg').close();$('add').onclick=()=>openDlg();"
          replacement="$('cancel').onclick=()=>$('dlg').close();$('backup').onclick=backupData;$('restore').onclick=()=>$('restoreFile').click();$('restoreFile').onchange=e=>{const f=e.target.files?.[0];if(f)restoreData(f)};$('add').onclick=()=>openDlg();"
          assert marker in s
          s=s.replace(marker,replacement,1)
          assert "KEY='task-manager-v1'" in s
          assert 'id="backup"' in s and 'id="restore"' in s
          p.write_text(s,encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          assert m
          Path('/tmp/app.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add JSON backup and restore"
          git push
