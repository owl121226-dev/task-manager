name: Fix fixed task spacers
on:
  push:
    paths:
      - '.github/workflows/fix-fixed-spacers.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make separators persistent
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace("const state={tasks:[],collapsed:{},filter:'all',view:new Date(new Date().getFullYear(),new Date().getMonth(),1)};","const state={tasks:[],collapsed:{},spacers:[],spacersInitialized:false,filter:'all',view:new Date(new Date().getFullYear(),new Date().getMonth(),1)};")
          s=s.replace("function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x){state.tasks=x.tasks||[];state.collapsed=x.collapsed||{}}}catch(e){}}\nfunction save(){localStorage.setItem(KEY,JSON.stringify({tasks:state.tasks,collapsed:state.collapsed}))}","function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x){state.tasks=x.tasks||[];state.collapsed=x.collapsed||{};state.spacers=Array.isArray(x.spacers)?x.spacers:[];state.spacersInitialized=!!x.spacersInitialized}}catch(e){}}\nfunction save(){localStorage.setItem(KEY,JSON.stringify({tasks:state.tasks,collapsed:state.collapsed,spacers:state.spacers,spacersInitialized:state.spacersInitialized}))}")
          old="""function normTitle(s){return String(s||'').replace(/[\\s\\u3000]+/g,'')}
          function render(){renderHead();$('rows').innerHTML='';const list=visible();if(!list.length){$('rows').innerHTML='<div class=\"empty\">該当するタスクはありません。</div>';return}if(state.filter==='all'){const breakBefore=new Set(['当座確認','朝交通安全','売上確定','早〆請求書']);let group=document.createElement('div');group.className='groupBox';for(let i=0;i<list.length;i++){if(i>0&&breakBefore.has(normTitle(list[i].t.title))){if(group.children.length)$('rows').appendChild(group);const sp=document.createElement('div');sp.className='groupSpacer';$('rows').appendChild(sp);group=document.createElement('div');group.className='groupBox'}group.appendChild(row(list[i].t,list[i].depth,list[i].kids))}if(group.children.length)$('rows').appendChild(group)}else{for(const x of list)$('rows').appendChild(row(x.t,x.depth,x.kids))}}"""
          new="""function normTitle(s){return String(s||'').replace(/[\\s\\u3000]+/g,'')}
          function initFixedSpacers(){if(state.spacersInitialized)return;const roots=children(null),targets=['当座確認','東備消防打合せ','売上確定','早〆請求書'],ids=[];for(const target of targets){const i=roots.findIndex(t=>normTitle(t.title)===target);if(i>0)ids.push(roots[i-1].id)}state.spacers=[...new Set(ids)];state.spacersInitialized=true;save()}
          function render(){renderHead();$('rows').innerHTML='';const list=visible();if(!list.length){$('rows').innerHTML='<div class=\"empty\">該当するタスクはありません。</div>';return}if(state.filter==='all'){const fixed=new Set(state.spacers);let group=document.createElement('div');group.className='groupBox';for(const x of list){group.appendChild(row(x.t,x.depth,x.kids));if(fixed.has(x.t.id)){if(group.children.length)$('rows').appendChild(group);const sp=document.createElement('div');sp.className='groupSpacer';$('rows').appendChild(sp);group=document.createElement('div');group.className='groupBox'}}if(group.children.length)$('rows').appendChild(group)}else{for(const x of list)$('rows').appendChild(row(x.t,x.depth,x.kids))}}"""
          if old not in s:
              raise SystemExit('render pattern not found')
          s=s.replace(old,new)
          oldrem="""function remove(id){const t=state.tasks.find(x=>x.id===id),kids=descendants(id);if(!t||!confirm(kids.length?`「${t.title}」とサブタスク${kids.length}件を削除しますか？`:`「${t.title}」を削除しますか？`))return;const ids=new Set([id,...kids.map(x=>x.id)]);state.tasks=state.tasks.filter(x=>!ids.has(x.id));save();render();notice('削除しました')}"""
          newrem="""function remove(id){const t=state.tasks.find(x=>x.id===id),kids=descendants(id);if(!t||!confirm(kids.length?`「${t.title}」とサブタスク${kids.length}件を削除しますか？`:`「${t.title}」を削除しますか？`))return;const ids=new Set([id,...kids.map(x=>x.id)]),roots=children(null);state.spacers=state.spacers.map(sid=>{if(!ids.has(sid))return sid;const i=roots.findIndex(x=>x.id===sid);for(let j=i-1;j>=0;j--)if(!ids.has(roots[j].id))return roots[j].id;return null}).filter(Boolean);state.spacers=[...new Set(state.spacers)];state.tasks=state.tasks.filter(x=>!ids.has(x.id));save();render();notice('削除しました')}"""
          if oldrem not in s:
              raise SystemExit('remove pattern not found')
          s=s.replace(oldrem,newrem)
          s=s.replace("load();render();setTimeout(scrollToday,20);","load();initFixedSpacers();render();setTimeout(scrollToday,20);")
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make task group spacers persistent"
          git push
