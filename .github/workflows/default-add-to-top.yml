name: Default new tasks to Task group
on:
  push:
    paths:
      - '.github/workflows/default-add-to-top.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch default category
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="$('category').value=t?.category||p?.category||'normal';"
          new="$('category').value=t?.category||p?.category||'top';"
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          assert m
          Path('/tmp/app.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Default new tasks to Task group"
          git push
