name: Add bottom spacing once
on:
  push:
    paths:
      - '.github/workflows/add-bottom-space.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add five blank rows at bottom
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if '.bottomSpacer{' not in s:
              s=s.replace('.empty{padding:45px;text-align:center;color:#737b87}', '.empty{padding:45px;text-align:center;color:#737b87}.bottomSpacer{height:240px;background:#fff}')
          if '<div class="bottomSpacer" aria-hidden="true"></div>' not in s:
              s=s.replace('<div id="rows"></div></div></main>', '<div id="rows"></div><div class="bottomSpacer" aria-hidden="true"></div></div></main>')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Add five blank rows at bottom'
          git push