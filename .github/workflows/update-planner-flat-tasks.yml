name: Update planner and flatten tasks
on:
  push:
    paths:
      - '.github/workflows/update-planner-flat-tasks.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested planner and task changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          reps={
            'background-image:repeating-linear-gradient(to bottom,#e3e7eb 0 1px,transparent 1px 32px);background-size:100% 32px':'background-image:repeating-linear-gradient(to bottom,#e3e7eb 0 1px,transparent 1px 16px);background-size:100% 16px',
            'function snap15(v){return Math.round(v/30)*30}':'function snap15(v){return Math.round(v/15)*15}',
            'for(let m=8*60;m<=18*60;m+=30)':'for(let m=8*60;m<=18*60;m+=15)',
            '所要時間変更（30分単位）':'所要時間変更（15分単位）',
            'Math.min(PLAN_END-30,timeToMinutes(p.time)??PLAN_START)':'Math.min(PLAN_END-15,timeToMinutes(p.time)??PLAN_START)',
            'duration=Math.max(30,Math.min(PLAN_END-start,Number(p.duration)||60))':'duration=Math.max(15,Math.min(PLAN_END-start,Number(p.duration)||60))',
            'duration=Math.max(30,Number(p.duration)||60)':'duration=Math.max(15,Number(p.duration)||60)',
            'd0=Math.max(30,Number(p.duration)||60)':'d0=Math.max(15,Number(p.duration)||60)',
            'd=Math.max(30,Math.min(PLAN_END-start,snap15(d0+delta)))':'d=Math.max(15,Math.min(PLAN_END-start,snap15(d0+delta)))'
          }
          for old,new in reps.items():
            if old not in s: raise SystemExit('missing planner anchor: '+old)
            s=s.replace(old,new)
          old='.unplannedBox{border:1px solid #e1e5ea;border-radius:10px;background:#fafbfc;padding:10px 12px;margin-bottom:0;max-height:704px;overflow:auto}'
          new='.unplannedBox{grid-column:2;border:1px solid #e1e5ea;border-radius:10px;background:#fafbfc;padding:10px 12px;margin-bottom:0;max-height:704px;overflow:auto}'
          if old not in s: raise SystemExit('unplanned css anchor missing')
          s=s.replace(old,new,1)
          old='.scheduleWrap{position:relative;border:1px solid #dfe3e8;border-radius:12px;background:#fff;overflow:hidden}'
          new='.scheduleWrap{grid-column:1;grid-row:1;position:relative;border:1px solid #dfe3e8;border-radius:12px;background:#fff;overflow:hidden}'
          if old not in s: raise SystemExit('schedule css anchor missing')
          s=s.replace(old,new,1)
          old='@media(max-width:820px){.todayPlanner{padding:12px 8px 70px}.plannerBody{grid-template-columns:1fr}.unplannedBox{max-height:none;margin-bottom:0}.plannerHint{display:none}'
          new='@media(max-width:820px){.todayPlanner{padding:12px 8px 70px}.plannerBody{grid-template-columns:1fr}.unplannedBox,.scheduleWrap{grid-column:1;grid-row:auto}.unplannedBox{max-height:none;margin-bottom:0}.plannerHint{display:none}'
          if old not in s: raise SystemExit('mobile css anchor missing')
          s=s.replace(old,new,1)
          old="function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,7)}\nfunction load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x){state.tasks=(x.tasks||[]).map(t=>({...t,start:normalizeStored(t.start),end:normalizeStored(t.end)}));state.collapsed=x.collapsed||{};save()}}catch(e){}}"
          new="function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,7)}\nfunction flattenHierarchy(tasks){const byParent=new Map(),out=[],seen=new Set();for(const t of tasks){const k=t.parentId||null;if(!byParent.has(k))byParent.set(k,[]);byParent.get(k).push(t)}for(const a of byParent.values())a.sort((x,y)=>(x.order||0)-(y.order||0));function visit(t){if(!t||seen.has(t.id))return;seen.add(t.id);out.push(t);for(const c of byParent.get(t.id)||[])visit(c)}for(const t of byParent.get(null)||[])visit(t);for(const t of tasks)visit(t);return out.map((t,i)=>({...t,parentId:null,order:(i+1)*10}))}\nfunction load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x){state.tasks=flattenHierarchy((x.tasks||[]).map(t=>({...t,start:normalizeStored(t.start),end:normalizeStored(t.end)})));state.collapsed={};save()}}catch(e){}}"
          if old not in s: raise SystemExit('load anchor missing')
          s=s.replace(old,new,1)
          old="state.tasks=data.tasks.map(t=>({...t,start:normalizeStored(t.start),end:normalizeStored(t.end)}));state.collapsed=data.collapsed&&typeof data.collapsed==='object'?data.collapsed:{};"
          new="state.tasks=flattenHierarchy(data.tasks.map(t=>({...t,start:normalizeStored(t.start),end:normalizeStored(t.end)})));state.collapsed={};"
          if old not in s: raise SystemExit('restore anchor missing')
          s=s.replace(old,new,1)
          old='let dragging=null,autoScrollFrame=null,autoScrollSpeed=0;'
          new='let dragging=null,autoScrollFrame=null,autoScrollSpeed=0,insertAfterId=null;'
          if old not in s: raise SystemExit('globals anchor missing')
          s=s.replace(old,new,1)
          old="a.append(mini('＋','サブタスク追加',()=>openDlg(null,t.id)),mini('✎','編集',()=>openDlg(t.id)),mini('×','削除',()=>remove(t.id),'del'));"
          new="a.append(mini('＋','この下にタスクを追加',()=>openDlg(null,t.id)),mini('✎','編集',()=>openDlg(t.id)),mini('×','削除',()=>remove(t.id),'del'));"
          if old not in s: raise SystemExit('plus anchor missing')
          s=s.replace(old,new,1)
          m=re.search(r"function openDlg\(id=null,pid=null\)\{.*?\}\nfunction nextOrder\(pid\)\{return Math\.max\(0,\.\.\.children\(pid\)\.map\(x=>x\.order\|\|0\)\)\+10\}",s)
          if not m: raise SystemExit('openDlg block missing')
          new="function openDlg(id=null,afterId=null){const t=id?state.tasks.find(x=>x.id===id):null,ref=afterId?state.tasks.find(x=>x.id===afterId):null;insertAfterId=id?null:afterId;$('editId').value=id||'';$('parentId').value='';$('dlgTitle').textContent=t?'タスクを編集':afterId?'下にタスクを追加':'タスクを追加';$('title').value=t?.title||'';$('start').value=short(t?.start||'');$('end').value=short(t?.end||'');$('category').value=t?.category||ref?.category||'top';$('keepCompleted').checked=!!t?.keepCompleted;$('keepLabel').textContent='完了しても完了タブへ移動しない';$('dlg').showModal();setTimeout(()=>$('title').focus(),20)}\nfunction nextOrder(pid=null){return Math.max(0,...children(null).map(x=>x.order||0))+10}\nfunction placeTaskAfter(newId,targetId){const a=children(null),from=a.findIndex(x=>x.id===newId),target=a.findIndex(x=>x.id===targetId);if(from<0||target<0)return;const [task]=a.splice(from,1),to=a.findIndex(x=>x.id===targetId);a.splice(to+1,0,task);a.forEach((x,i)=>x.order=(i+1)*10)}"
          s=s[:m.start()]+new+s[m.end():]
          m=re.search(r"function remove\(id\)\{const t=state\.tasks\.find\(x=>x\.id===id\),kids=descendants\(id\);.*?notice\('削除しました'\)\}",s)
          if not m: raise SystemExit('remove block missing')
          new="function remove(id){const t=state.tasks.find(x=>x.id===id);if(!t||!confirm(`「${t.title}」を削除しますか？`))return;state.tasks=state.tasks.filter(x=>x.id!==id);save();render();notice('削除しました')}"
          s=s[:m.start()]+new+s[m.end():]
          m=re.search(r"\$\('form'\)\.onsubmit=e=>\{e\.preventDefault\(\);const id=.*?notice\(id\?'更新しました':'追加しました'\)\};",s)
          if not m: raise SystemExit('form submit block missing')
          new="$('form').onsubmit=e=>{e.preventDefault();const id=$('editId').value||null,title=$('title').value.trim(),old=id?state.tasks.find(x=>x.id===id):null;let start=parseMD($('start').value,old?.start||''),end=parseMD($('end').value,old?.end||'');if(!title)return;if(start===null||end===null){notice('日付はMM/DDまたはYYYY/MM/DDで入力してください');return}if(start&&end&&end<start)[start,end]=[end,start];if(id){Object.assign(old,{title,start,end,category:$('category').value,keepCompleted:$('keepCompleted').checked,parentId:null})}else{const task={id:uid(),title,start,end,completed:false,parentId:null,category:$('category').value,keepCompleted:$('keepCompleted').checked,order:nextOrder()};state.tasks.push(task);if(insertAfterId)placeTaskAfter(task.id,insertAfterId)}insertAfterId=null;save();$('dlg').close();render();notice(id?'更新しました':'追加しました')};"
          s=s[:m.start()]+new+s[m.end():]
          old="$('cancel').onclick=()=>$('dlg').close();"
          new="$('cancel').onclick=()=>{insertAfterId=null;$('dlg').close()};"
          if old not in s: raise SystemExit('cancel anchor missing')
          s=s.replace(old,new,1)
          assert "KEY='task-manager-v1'" in s
          p.write_text(s,encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          assert m
          Path('/tmp/app.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use 15-minute planner and flat task insertion"
          git push
