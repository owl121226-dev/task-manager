name: Adjust daily timeline
on:
  push:
    paths:
      - '.github/workflows/adjust-daily-timeline.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set planner to 08-19 and 30-minute steps
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          reps={
            'height:1088px;margin-left:72px;background-image:repeating-linear-gradient(to bottom,#e3e7eb 0 1px,transparent 1px 16px);background-size:100% 16px':'height:704px;margin-left:72px;background-image:repeating-linear-gradient(to bottom,#e3e7eb 0 1px,transparent 1px 32px);background-size:100% 32px',
            'const PLAN_START=5*60,PLAN_END=22*60,PLAN_HOUR_PX=64;':'const PLAN_START=8*60,PLAN_END=19*60,PLAN_HOUR_PX=64;',
            'function snap15(v){return Math.round(v/15)*15}':'function snap15(v){return Math.round(v/30)*30}',
            'for(let m=9*60;m<=18*60;m+=30)':'for(let m=8*60;m<=18*60;m+=30)',
            'return 9*60':'return 8*60',
            '所要時間変更（15分単位）':'所要時間変更（30分単位）',
            'for(let h=5;h<=22;h++)':'for(let h=8;h<=19;h++)',
            "h===5?' first':''":"h===8?' first':''",
            'Math.min(PLAN_END-15,timeToMinutes(p.time)??PLAN_START)':'Math.min(PLAN_END-30,timeToMinutes(p.time)??PLAN_START)',
            'duration=Math.max(15,Math.min(PLAN_END-start,Number(p.duration)||60))':'duration=Math.max(30,Math.min(PLAN_END-start,Number(p.duration)||60))',
            'duration=Math.max(15,Number(p.duration)||60)':'duration=Math.max(30,Number(p.duration)||60)',
            'd0=Math.max(15,Number(p.duration)||60)':'d0=Math.max(30,Number(p.duration)||60)',
            'd=Math.max(15,Math.min(PLAN_END-start,snap15(d0+delta)))':'d=Math.max(30,Math.min(PLAN_END-start,snap15(d0+delta)))'
          }
          for old,new in reps.items():
            if old not in s:
              raise SystemExit(f'missing: {old}')
            s=s.replace(old,new)
          assert "KEY='task-manager-v1'" in s
          p.write_text(s,encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          assert m
          Path('/tmp/app.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Set Today planner to 08-19 with 30-minute steps"
          git push
