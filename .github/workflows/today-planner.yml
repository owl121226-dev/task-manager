name: Today planner
on:
  push:
    paths:
      - '.github/workflows/today-planner.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add independent today planning
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Today planner styles: same 4-column footprint, no wider layout.
          anchor='.date{min-height:36px;display:flex;align-items:center}.dateInput{width:100%;min-width:0;border:1px solid transparent;border-radius:6px;background:transparent;padding:6px 5px;font-size:12px;color:#374151;outline:none}.dateInput:hover{border-color:#dfe3e8;background:#fff}.dateInput:focus{border-color:#9ebcf5;background:#fff;box-shadow:0 0 0 2px #dbeafe}.dateInput::placeholder{color:#b0b7c0}.actions{display:flex;justify-content:flex-end;gap:2px}.mini{padding:6px 5px}.mini.del:hover{background:#fee2e2;color:#b91c1c}'
          repl=anchor+'.planTime{min-height:36px;display:flex;align-items:center}.planTimeInput{width:100%;min-width:0;border:1px solid #d8dde3;border-radius:7px;background:#fff;padding:6px 7px;font-size:12px;color:#1f2937;outline:none;text-align:center}.planTimeInput:focus{border-color:#9ebcf5;box-shadow:0 0 0 2px #dbeafe}.priorityCell{display:flex;align-items:center;justify-content:center}.priorityBtn{border:1px solid #d5dbe1;background:#fff;color:#667085;border-radius:7px;padding:6px 10px;font-size:12px}.priorityBtn.high{background:#fee4e2;border-color:#fda29b;color:#b42318;font-weight:750}.row.highPriority .left{background:#fff4f2}.row.highPriority .name{color:#b42318;font-weight:750}.row.highPriority .timeline{box-shadow:inset 4px 0 0 #f97066}'
          assert anchor in s
          s=s.replace(anchor,repl,1)

          # Header ids so labels can switch in Today view.
          old='<div class="leftGrid"><div>タスク</div><div>開始日</div><div>締切日</div><div></div></div>'
          new='<div class="leftGrid"><div>タスク</div><div id="col2">開始日</div><div id="col3">締切日</div><div></div></div>'
          assert old in s
          s=s.replace(old,new,1)

          # Daily plan helpers.
          anchor="function descendants(id){const out=[];for(const c of children(id))out.push(c,...descendants(c.id));return out}\n"
          add="function descendants(id){const out=[];for(const c of children(id))out.push(c,...descendants(c.id));return out}\nfunction todayKey(){return iso(day(new Date()))}\nfunction getTodayPlan(t,create=false){const k=todayKey();if(!t.dailyPlans){if(!create)return null;t.dailyPlans={}}if(!t.dailyPlans[k]&&create)t.dailyPlans[k]={time:'',priority:'',order:null};return t.dailyPlans[k]||null}\nfunction todayOrder(t){const p=getTodayPlan(t);return Number.isFinite(p?.order)?p.order:(t.order||0)}\nfunction normalizeTime(v){v=(v||'').trim();if(!v)return '';if(/^\\d{3,4}$/.test(v)){v=v.padStart(4,'0');v=v.slice(0,2)+':'+v.slice(2)}const m=v.match(/^(\\d{1,2}):(\\d{2})$/);if(!m)return null;const h=Number(m[1]),mi=Number(m[2]);if(h>23||mi>59)return null;return `${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}`}\n"
          assert anchor in s
          s=s.replace(anchor,add,1)

          # Sort hierarchy using today's independent order only in Today view.
          old="for(const a of byParent.values())a.sort((x,y)=>(x.order||0)-(y.order||0));const kidsOf=id=>byParent.get(id||null)||[],memo=new Map();"
          new="for(const a of byParent.values())a.sort((x,y)=>state.filter==='today'?todayOrder(x)-todayOrder(y):(x.order||0)-(y.order||0));const kidsOf=id=>byParent.get(id||null)||[],memo=new Map();"
          assert old in s
          s=s.replace(old,new,1)

          # Header labels switch without changing overall width.
          old="function render(){renderHead();$('rows').innerHTML='';const list=visible();"
          new="function render(){renderHead();$('col2').textContent=state.filter==='today'?'実行時刻':'開始日';$('col3').textContent=state.filter==='today'?'優先':'締切日';$('rows').innerHTML='';const list=visible();"
          assert old in s
          s=s.replace(old,new,1)

          # Row class and cells depend on Today plan.
          old="function row(t,depth,kids){const r=document.createElement('div');r.className='row'+(depth?' sub':'')+(t.completed?' done':'');r.dataset.id=t.id;const l=document.createElement('div');l.className='left';const g=document.createElement('div');g.className='taskGrid';"
          new="function row(t,depth,kids){const r=document.createElement('div'),tp=state.filter==='today'?getTodayPlan(t):null;r.className='row'+(depth?' sub':'')+(t.completed?' done':'')+(tp?.priority==='high'?' highPriority':'');r.dataset.id=t.id;const l=document.createElement('div');l.className='left';const g=document.createElement('div');g.className='taskGrid';"
          assert old in s
          s=s.replace(old,new,1)

          # Drag/drop uses independent Today order in Today tab.
          old="r.ondragleave=()=>r.classList.remove('before','after');r.ondrop=e=>{if(!dragging||dragging===t.id)return;const src=state.tasks.find(x=>x.id===dragging);if(!src||(src.parentId||null)!==(t.parentId||null))return;e.preventDefault();const z=r.getBoundingClientRect();reorder(dragging,t.id,e.clientY<z.top+z.height/2)};"
          new="r.ondragleave=()=>r.classList.remove('before','after');r.ondrop=e=>{if(!dragging||dragging===t.id)return;const src=state.tasks.find(x=>x.id===dragging);if(!src||(src.parentId||null)!==(t.parentId||null))return;e.preventDefault();const z=r.getBoundingClientRect();if(state.filter==='today')reorderToday(dragging,t.id,e.clientY<z.top+z.height/2);else reorder(dragging,t.id,e.clientY<z.top+z.height/2)};"
          assert old in s
          s=s.replace(old,new,1)

          old="const s=dateCell(t,'start'),e=dateCell(t,'end'),a=document.createElement('div');a.className='actions';\na.append(mini('＋','サブタスク追加',()=>openDlg(null,t.id)),mini('✎','編集',()=>openDlg(t.id)),mini('×','削除',()=>remove(t.id),'del'));\ng.append(title,s,e,a);l.appendChild(g);r.append(l,timeline(t));return r}"
          new="const c2=state.filter==='today'?planTimeCell(t):dateCell(t,'start'),c3=state.filter==='today'?priorityCell(t,r):dateCell(t,'end'),a=document.createElement('div');a.className='actions';\na.append(mini('＋','サブタスク追加',()=>openDlg(null,t.id)),mini('✎','編集',()=>openDlg(t.id)),mini('×','削除',()=>remove(t.id),'del'));\ng.append(title,c2,c3,a);l.appendChild(g);r.append(l,timeline(t));return r}"
          assert old in s
          s=s.replace(old,new,1)

          # Time and priority controls.
          anchor="function mini(txt,tip,fn,cls=''){const b=document.createElement('button');b.className='mini '+cls;b.textContent=txt;b.title=tip;b.onclick=fn;return b}\n"
          add="function mini(txt,tip,fn,cls=''){const b=document.createElement('button');b.className='mini '+cls;b.textContent=txt;b.title=tip;b.onclick=fn;return b}\nfunction planTimeCell(t){const d=document.createElement('div');d.className='planTime';const i=document.createElement('input');i.className='planTimeInput';i.type='text';i.inputMode='numeric';i.maxLength=5;i.placeholder='HH:MM';i.value=getTodayPlan(t)?.time||'';i.title='例: 09:30 または 0930';const commit=()=>{const v=normalizeTime(i.value);if(v===null){notice('時刻はHH:MMで入力してください');i.value=getTodayPlan(t)?.time||'';return}const p=getTodayPlan(t,true);if(p.time!==v){p.time=v;save()}i.value=v};i.onblur=commit;i.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();i.blur()}else if(e.key==='Escape'){i.value=getTodayPlan(t)?.time||'';i.blur()}};d.appendChild(i);return d}\nfunction priorityCell(t,rowEl){const d=document.createElement('div');d.className='priorityCell';const b=document.createElement('button'),p=getTodayPlan(t);b.className='priorityBtn'+(p?.priority==='high'?' high':'');b.textContent=p?.priority==='high'?'高':'通常';b.title='クリックで高優先度を切り替え';b.onclick=()=>{const x=getTodayPlan(t,true);x.priority=x.priority==='high'?'':'high';save();render()};d.appendChild(b);return d}\n"
          assert anchor in s
          s=s.replace(anchor,add,1)

          # Independent per-day reordering; siblings only, preserving hierarchy.
          anchor="function reorder(srcId,targetId,before){const src=state.tasks.find(x=>x.id===srcId),target=state.tasks.find(x=>x.id===targetId);if(!src||!target||(src.parentId||null)!==(target.parentId||null))return;const pid=src.parentId||null,a=children(pid),from=a.findIndex(x=>x.id===srcId);a.splice(from,1);let to=a.findIndex(x=>x.id===targetId);if(!before)to++;a.splice(to,0,src);a.forEach((x,i)=>x.order=(i+1)*10);save();render();notice('並び替えました')}\n"
          add=anchor+"function reorderToday(srcId,targetId,before){const src=state.tasks.find(x=>x.id===srcId),target=state.tasks.find(x=>x.id===targetId);if(!src||!target||(src.parentId||null)!==(target.parentId||null))return;const pid=src.parentId||null,a=state.tasks.filter(x=>(x.parentId||null)===pid).sort((x,y)=>todayOrder(x)-todayOrder(y)),from=a.findIndex(x=>x.id===srcId);if(from<0)return;a.splice(from,1);let to=a.findIndex(x=>x.id===targetId);if(to<0)return;if(!before)to++;a.splice(to,0,src);a.forEach((x,i)=>{getTodayPlan(x,true).order=(i+1)*10});save();render();notice('今日の並び順を変更しました')}\n"
          assert anchor in s
          s=s.replace(anchor,add,1)

          assert "KEY='task-manager-v1'" in s
          p.write_text(s,encoding='utf-8')
          m=re.search(r'<script>([\\s\\S]*?)</script>',s)
          assert m
          Path('/tmp/app.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add independent Today planner with time and priority"
          git push
