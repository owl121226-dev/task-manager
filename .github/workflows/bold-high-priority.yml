name: Bold high priority tasks
on:
  push:
    paths:
      - '.github/workflows/bold-high-priority.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bold high priority task names
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          anchor='.scheduleCard.high{background:#fff4f2;border-color:#fda29b;border-left-color:#f04438}'
          add=anchor+'.scheduleCard.high .scheduleName{font-weight:800}.unplannedItem.high .uName{font-weight:800}'
          if anchor not in s:
            raise SystemExit('anchor missing')
          s=s.replace(anchor,add,1)
          assert "KEY='task-manager-v1'" in s
          p.write_text(s,encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          Path('/tmp/app.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Bold high priority task names"
          git push
