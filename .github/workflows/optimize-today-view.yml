name: Optimize today view
on:
  push:
    paths:
      - '.github/workflows/optimize-today-view.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Optimize today filtering and hierarchy scan
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="function visible(){const out=[];function visit(t,depth){const kids=children(t.id),show=match(t)||descendants(t.id).some(match);if(show)out.push({t,depth,kids});if(!state.collapsed[t.id])for(const c of kids)if(match(c)||descendants(c.id).some(match))visit(c,depth+1)}for(const r of children(null))if(match(r)||descendants(r.id).some(match))visit(r,0);return out}"
          new="function visible(){const out=[],byParent=new Map();for(const t of state.tasks){const k=t.parentId||null;if(!byParent.has(k))byParent.set(k,[]);byParent.get(k).push(t)}for(const a of byParent.values())a.sort((x,y)=>(x.order||0)-(y.order||0));const kidsOf=id=>byParent.get(id||null)||[],memo=new Map();function hasMatch(t){if(memo.has(t.id))return memo.get(t.id);const v=match(t)||kidsOf(t.id).some(hasMatch);memo.set(t.id,v);return v}function visit(t,depth){const kids=kidsOf(t.id),self=match(t);if(state.filter==='today'){if(self)out.push({t,depth,kids});if(!state.collapsed[t.id])for(const c of kids)if(hasMatch(c))visit(c,self?depth+1:depth);return}if(self||kids.some(hasMatch))out.push({t,depth,kids});if(!state.collapsed[t.id])for(const c of kids)if(hasMatch(c))visit(c,depth+1)}for(const r of kidsOf(null))if(hasMatch(r))visit(r,0);return out}"
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Optimize task filtering and Today hierarchy"
          git push
