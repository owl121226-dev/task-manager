name: Subtask parent completion and render optimization
on:
  push:
    paths:
      - '.github/workflows/subtask-parent-completion.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update subtask completion behavior and reduce redraws
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old_label='<label class="keepField"><input type="checkbox" id="keepCompleted">完了しても完了タブへ移動しない</label>'
          new_label='<label class="keepField"><input type="checkbox" id="keepCompleted"><span id="keepLabel">完了しても完了タブへ移動しない</span></label>'
          assert old_label in s
          s=s.replace(old_label,new_label,1)

          old_match="function match(t){const now=day(new Date()),keep=!!t.keepCompleted;if(state.filter==='completed')return !!t.completed&&!keep;if(t.completed&&!keep)return false;if(state.filter==='all')return t.category!=='someday';if(state.filter==='someday')return t.category==='someday';if(state.filter==='today'){if(t.category==='someday')return false;const due=date(t.end)||date(t.start);return intersects(t,now,now)||(due&&due<=now)}return true}"
          new_match="function completionRoot(t,byId){let r=t,guard=0;while(r?.parentId&&guard++<50){const p=byId.get(r.parentId);if(!p)break;r=p}return r||t}\nfunction movedToCompleted(t,byId){if(t.keepCompleted)return false;const root=completionRoot(t,byId);return !!root.completed&&!root.keepCompleted}\nfunction match(t,byId){const now=day(new Date()),moved=movedToCompleted(t,byId);if(state.filter==='completed')return moved;if(moved)return false;if(state.filter==='all')return t.category!=='someday';if(state.filter==='someday')return t.category==='someday';if(state.filter==='today'){if(t.category==='someday')return false;const due=date(t.end)||date(t.start);return intersects(t,now,now)||(due&&due<=now)}return true}"
          assert old_match in s
          s=s.replace(old_match,new_match,1)

          old_visible="function visible(){const out=[],byParent=new Map();for(const t of state.tasks){const k=t.parentId||null;if(!byParent.has(k))byParent.set(k,[]);byParent.get(k).push(t)}for(const a of byParent.values())a.sort((x,y)=>(x.order||0)-(y.order||0));const kidsOf=id=>byParent.get(id||null)||[],memo=new Map();function hasMatch(t){if(memo.has(t.id))return memo.get(t.id);const v=match(t)||kidsOf(t.id).some(hasMatch);memo.set(t.id,v);return v}function pushAll(t,depth){const kids=kidsOf(t.id);out.push({t,depth,kids});for(const c of kids)pushAll(c,depth+1)}function visit(t,depth){const kids=kidsOf(t.id),self=match(t);if(state.filter==='today'){if(self){pushAll(t,depth);return}for(const c of kids)if(hasMatch(c))visit(c,depth);return}if(self||kids.some(hasMatch))out.push({t,depth,kids});for(const c of kids)if(hasMatch(c))visit(c,depth+1)}for(const r of kidsOf(null))if(hasMatch(r))visit(r,0);return out}"
          new_visible="function visible(){const out=[],byParent=new Map(),byId=new Map();for(const t of state.tasks){byId.set(t.id,t);const k=t.parentId||null;if(!byParent.has(k))byParent.set(k,[]);byParent.get(k).push(t)}for(const a of byParent.values())a.sort((x,y)=>(x.order||0)-(y.order||0));const kidsOf=id=>byParent.get(id||null)||[],memo=new Map();function hasMatch(t){if(memo.has(t.id))return memo.get(t.id);const v=match(t,byId)||kidsOf(t.id).some(hasMatch);memo.set(t.id,v);return v}function pushAll(t,depth){const kids=kidsOf(t.id);out.push({t,depth,kids});for(const c of kids)pushAll(c,depth+1)}function visit(t,depth){const kids=kidsOf(t.id),self=match(t,byId);if(state.filter==='today'){if(self){pushAll(t,depth);return}for(const c of kids)if(hasMatch(c))visit(c,depth);return}if(self||kids.some(hasMatch))out.push({t,depth,kids});for(const c of kids)if(hasMatch(c))visit(c,depth+1)}for(const r of kidsOf(null))if(hasMatch(r))visit(r,0);return out}"
          assert old_visible in s
          s=s.replace(old_visible,new_visible,1)

          old_root="function rootTask(t){let r=t,guard=0;while(r?.parentId&&guard++<50){const p=state.tasks.find(x=>x.id===r.parentId);if(!p)break;r=p}return r||t}\nfunction taskGroup(t){const r=rootTask(t);if(r.category==='top')return 'top';if(r.category==='future')return 'schedule';return 'accounting'}"
          new_root="function rootTask(t,byId){let r=t,guard=0;while(r?.parentId&&guard++<50){const p=byId?byId.get(r.parentId):state.tasks.find(x=>x.id===r.parentId);if(!p)break;r=p}return r||t}\nfunction taskGroup(t,byId){const r=rootTask(t,byId);if(r.category==='top')return 'top';if(r.category==='future')return 'schedule';return 'accounting'}"
          assert old_root in s
          s=s.replace(old_root,new_root,1)

          old_render="function render(){renderHead();$('rows').innerHTML='';const list=visible();if(!list.length){$('rows').innerHTML='<div class=\"empty\">該当するタスクはありません。</div>';return}if(state.filter==='all'){const buckets={top:[],schedule:[],accounting:[]};for(const x of list)buckets[taskGroup(x.t)].push(x);"
          new_render="function render(){renderHead();$('rows').innerHTML='';const list=visible();if(!list.length){$('rows').innerHTML='<div class=\"empty\">該当するタスクはありません。</div>';return}if(state.filter==='all'){const buckets={top:[],schedule:[],accounting:[]},byId=new Map(state.tasks.map(t=>[t.id,t]));for(const x of list)buckets[taskGroup(x.t,byId)].push(x);"
          assert old_render in s
          s=s.replace(old_render,new_render,1)

          old_head="function renderHead(){const y=state.view.getFullYear(),m=state.view.getMonth(),cnt=new Date(y,m+1,0).getDate(),today=day(new Date()),wd=['日','月','火','水','木','金','土'],dayPx=38,firstDow=new Date(y,m,1).getDay(),board=$('board');"
          new_head="function renderHead(){const y=state.view.getFullYear(),m=state.view.getMonth(),cnt=new Date(y,m+1,0).getDate(),today=day(new Date()),headKey=`${y}-${m}-${iso(today)}`,wd=['日','月','火','水','木','金','土'],dayPx=38,firstDow=new Date(y,m,1).getDay(),board=$('board');if(renderHead.key===headKey)return;renderHead.key=headKey;"
          assert old_head in s
          s=s.replace(old_head,new_head,1)

          old_open="function openDlg(id=null,pid=null){const t=id?state.tasks.find(x=>x.id===id):null,p=pid?state.tasks.find(x=>x.id===pid):null;$('editId').value=id||'';$('parentId').value=pid||'';$('dlgTitle').textContent=t?'タスクを編集':pid?'サブタスクを追加':'タスクを追加';$('title').value=t?.title||'';$('start').value=short(t?.start||'');$('end').value=short(t?.end||'');$('category').value=t?.category||p?.category||'top';$('keepCompleted').checked=!!t?.keepCompleted;$('dlg').showModal();setTimeout(()=>$('title').focus(),20)}"
          new_open="function openDlg(id=null,pid=null){const t=id?state.tasks.find(x=>x.id===id):null,p=pid?state.tasks.find(x=>x.id===pid):null,isSub=!!(pid||t?.parentId);$('editId').value=id||'';$('parentId').value=pid||'';$('dlgTitle').textContent=t?'タスクを編集':pid?'サブタスクを追加':'タスクを追加';$('title').value=t?.title||'';$('start').value=short(t?.start||'');$('end').value=short(t?.end||'');$('category').value=t?.category||p?.category||'top';$('keepCompleted').checked=!!t?.keepCompleted;$('keepLabel').textContent=isSub?'親タスク完了後も完了タブへ移動しない':'完了しても完了タブへ移動しない';$('dlg').showModal();setTimeout(()=>$('title').focus(),20)}"
          assert old_open in s
          s=s.replace(old_open,new_open,1)

          assert "KEY='task-manager-v1'" in s
          p.write_text(s,encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          assert m
          Path('/tmp/app.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make subtask completion follow parent and reduce header redraws"
          git push
