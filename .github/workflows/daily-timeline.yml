name: Daily timeline planner
on:
  push:
    paths:
      - '.github/workflows/daily-timeline.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add draggable daily timeline
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          css_anchor='.row.highPriority .timeline{box-shadow:inset 4px 0 0 #f97066}'
          css_add=css_anchor+'''.todayPlannerMode{min-width:0!important}.todayPlannerMode .head{display:none}.todayPlannerMode+.x{display:none}.todayPlanner{max-width:980px;margin:0 auto;padding:18px 18px 80px;background:#fff}.plannerTitleRow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}.plannerTitle{font-size:20px;font-weight:750}.plannerDate{font-size:12px;color:#667085;margin-top:3px}.plannerHint{font-size:12px;color:#667085}.unplannedBox{border:1px solid #e1e5ea;border-radius:10px;background:#fafbfc;padding:10px 12px;margin-bottom:14px}.unplannedHead{font-size:12px;font-weight:700;color:#59616c;margin-bottom:8px}.unplannedList{display:flex;flex-wrap:wrap;gap:7px}.unplannedItem{display:flex;align-items:center;gap:6px;max-width:100%;border:1px solid #dfe3e8;background:#fff;border-radius:8px;padding:6px 7px;font-size:12px}.unplannedItem.high{border-color:#fda29b;background:#fff4f2}.unplannedItem .uName{max-width:290px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.uBtn{border:0;background:#eef2f6;color:#475467;border-radius:6px;padding:4px 7px;font-size:11px}.uBtn.high{background:#fee4e2;color:#b42318;font-weight:700}.scheduleWrap{position:relative;border:1px solid #dfe3e8;border-radius:12px;background:#fff;overflow:hidden}.scheduleGrid{position:relative;height:1088px;margin-left:72px;background-image:repeating-linear-gradient(to bottom,#e3e7eb 0 1px,transparent 1px 16px);background-size:100% 16px}.scheduleGrid::before{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(to bottom,#cfd5dc 0 1px,transparent 1px 64px);pointer-events:none}.hourLabel{position:absolute;left:-62px;width:50px;transform:translateY(-50%);text-align:right;font-size:12px;color:#475467}.hourLabel.first{transform:none}.scheduleCard{position:absolute;left:14px;right:14px;min-height:28px;border:1px solid #cfd6de;border-left:5px solid #98a2b3;border-radius:8px;background:#f8fafc;box-shadow:0 2px 7px #10182818;overflow:hidden;z-index:3;touch-action:none}.scheduleCard:hover{z-index:8;box-shadow:0 5px 15px #10182824}.scheduleCard.high{background:#fff4f2;border-color:#fda29b;border-left-color:#f04438}.scheduleCard.done{opacity:.58}.scheduleCard.done .scheduleName{text-decoration:line-through}.scheduleInner{height:100%;display:flex;align-items:flex-start;gap:7px;padding:6px 7px 9px}.scheduleDrag{flex:none;width:22px;height:22px;border:0;background:transparent;color:#667085;cursor:grab;border-radius:5px;padding:0;touch-action:none}.scheduleDrag:active{cursor:grabbing}.scheduleDrag:hover{background:#e9edf2}.scheduleCheck{width:16px;height:16px;margin:2px 0 0;flex:none}.scheduleText{min-width:0;flex:1}.scheduleName{font-size:13px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.scheduleCard.sub .scheduleName{font-weight:500}.scheduleMeta{font-size:11px;color:#667085;margin-top:2px}.scheduleActions{display:flex;gap:2px;flex:none}.scheduleMini{border:0;background:transparent;color:#667085;border-radius:5px;padding:2px 5px;font-size:12px}.scheduleMini:hover{background:#e9edf2}.scheduleMini.high{color:#b42318;background:#fee4e2}.resizeHandle{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize;background:transparent;touch-action:none}.resizeHandle:hover{background:#d0d5dd66}.nowLine{position:absolute;left:0;right:0;height:2px;background:#f04438;z-index:9;pointer-events:none}.nowLine::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;background:#f04438;border-radius:50%}@media(max-width:820px){.todayPlanner{padding:12px 8px 70px}.plannerHint{display:none}.scheduleGrid{margin-left:56px}.hourLabel{left:-51px;width:43px}.scheduleCard{left:8px;right:8px}.unplannedItem .uName{max-width:180px}}'''
          assert css_anchor in s
          s=s.replace(css_anchor,css_add,1)

          old="function getTodayPlan(t,create=false){const k=todayKey();if(!t.dailyPlans){if(!create)return null;t.dailyPlans={}}if(!t.dailyPlans[k]&&create)t.dailyPlans[k]={time:'',priority:'',order:null};return t.dailyPlans[k]||null}"
          new="function getTodayPlan(t,create=false){const k=todayKey();if(!t.dailyPlans){if(!create)return null;t.dailyPlans={}}if(!t.dailyPlans[k]&&create)t.dailyPlans[k]={time:'',priority:'',order:null,duration:60};const p=t.dailyPlans[k]||null;if(p&&!(Number(p.duration)>0))p.duration=60;return p}"
          assert old in s
          s=s.replace(old,new,1)

          old="function render(){renderHead();$('col2').textContent=state.filter==='today'?'実行時刻':'開始日';$('col3').textContent=state.filter==='today'?'優先':'締切日';$('rows').innerHTML='';const list=visible();if(!list.length){$('rows').innerHTML='<div class=\"empty\">該当するタスクはありません。</div>';return}if(state.filter==='all'){"
          new="function render(){renderHead();const todayMode=state.filter==='today';$('board').classList.toggle('todayPlannerMode',todayMode);$('col2').textContent=todayMode?'実行時刻':'開始日';$('col3').textContent=todayMode?'優先':'締切日';$('rows').innerHTML='';const list=visible();if(todayMode){renderTodayPlanner(list);return}if(!list.length){$('rows').innerHTML='<div class=\"empty\">該当するタスクはありません。</div>';return}if(state.filter==='all'){"
          assert old in s
          s=s.replace(old,new,1)

          render_anchor="function row(t,depth,kids){const r=document.createElement('div'),tp=state.filter==='today'?getTodayPlan(t):null;"
          planner_js=r'''const PLAN_START=5*60,PLAN_END=22*60,PLAN_HOUR_PX=64;
function timeToMinutes(v){const m=String(v||'').match(/^(\d{1,2}):(\d{2})$/);if(!m)return null;const h=Number(m[1]),mi=Number(m[2]);return h*60+mi}
function minutesToTime(v){v=Math.max(0,Math.round(v));return `${String(Math.floor(v/60)).padStart(2,'0')}:${String(v%60).padStart(2,'0')}`}
function snap15(v){return Math.round(v/15)*15}
function plannerY(mins){return (mins-PLAN_START)/60*PLAN_HOUR_PX}
function nextPlannerTime(list){const busy=[];for(const x of list){const p=getTodayPlan(x.t),m=timeToMinutes(p?.time);if(m!==null)busy.push([m,m+(Number(p?.duration)||60)])}for(let m=9*60;m<=18*60;m+=30){if(!busy.some(([a,b])=>m<b&&m+60>a))return m}return 9*60}
function renderTodayPlanner(list){const rows=$('rows'),wrap=document.createElement('div');wrap.className='todayPlanner';if(!list.length){wrap.innerHTML='<div class="empty">今日のタスクはありません。</div>';rows.appendChild(wrap);return}const now=new Date(),title=document.createElement('div');title.className='plannerTitleRow';title.innerHTML=`<div><div class="plannerTitle">今日の予定</div><div class="plannerDate">${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日</div></div><div class="plannerHint">⋮ をドラッグ：時刻変更　／　下端をドラッグ：所要時間変更（15分単位）</div>`;wrap.appendChild(title);const unplanned=list.filter(x=>timeToMinutes(getTodayPlan(x.t)?.time)===null),planned=list.filter(x=>timeToMinutes(getTodayPlan(x.t)?.time)!==null);if(unplanned.length){const box=document.createElement('div');box.className='unplannedBox';const head=document.createElement('div');head.className='unplannedHead';head.textContent=`未配置 ${unplanned.length}件`;const ul=document.createElement('div');ul.className='unplannedList';for(const x of unplanned)ul.appendChild(makeUnplannedItem(x,list));box.append(head,ul);wrap.appendChild(box)}const sw=document.createElement('div');sw.className='scheduleWrap';const grid=document.createElement('div');grid.className='scheduleGrid';grid.id='scheduleGrid';for(let h=5;h<=22;h++){const lab=document.createElement('div');lab.className='hourLabel'+(h===5?' first':'');lab.style.top=`${plannerY(h*60)}px`;lab.textContent=`${h}:00`;grid.appendChild(lab)}for(const x of planned){const card=makeScheduleCard(x,grid);grid.appendChild(card)}const cur=now.getHours()*60+now.getMinutes();if(cur>=PLAN_START&&cur<=PLAN_END){const line=document.createElement('div');line.className='nowLine';line.style.top=`${plannerY(cur)}px`;grid.appendChild(line)}sw.appendChild(grid);wrap.appendChild(sw);rows.appendChild(wrap)}
function makeUnplannedItem(x,list){const t=x.t,p=getTodayPlan(t),el=document.createElement('div');el.className='unplannedItem'+(p?.priority==='high'?' high':'');const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!t.completed;cb.onchange=()=>{t.completed=cb.checked;save();render()};const nm=document.createElement('span');nm.className='uName';nm.textContent=(x.depth?'↳ '.repeat(Math.min(x.depth,2)):'')+t.title;const pri=document.createElement('button');pri.className='uBtn'+(p?.priority==='high'?' high':'');pri.textContent=p?.priority==='high'?'高':'優先';pri.onclick=()=>{const q=getTodayPlan(t,true);q.priority=q.priority==='high'?'':'high';save();render()};const put=document.createElement('button');put.className='uBtn';put.textContent='配置';put.title='空いている時刻へ配置してからドラッグで調整';put.onclick=()=>{const q=getTodayPlan(t,true),m=nextPlannerTime(list);q.time=minutesToTime(m);q.duration=Number(q.duration)||60;save();render();setTimeout(()=>{const c=document.querySelector(`.scheduleCard[data-id="${t.id}"]`);c?.scrollIntoView({block:'center',behavior:'smooth'})},30)};el.append(cb,nm,pri,put);return el}
function makeScheduleCard(x,grid){const t=x.t,p=getTodayPlan(t,true),start=Math.max(PLAN_START,Math.min(PLAN_END-15,timeToMinutes(p.time)??PLAN_START)),duration=Math.max(15,Math.min(PLAN_END-start,Number(p.duration)||60)),card=document.createElement('div');card.className='scheduleCard'+(x.depth?' sub':'')+(p.priority==='high'?' high':'')+(t.completed?' done':'');card.dataset.id=t.id;card.style.top=`${plannerY(start)}px`;card.style.height=`${Math.max(28,duration/60*PLAN_HOUR_PX)}px`;const inner=document.createElement('div');inner.className='scheduleInner';const drag=document.createElement('button');drag.className='scheduleDrag';drag.textContent='⋮';drag.title='ドラッグして時刻を変更';const cb=document.createElement('input');cb.type='checkbox';cb.className='scheduleCheck';cb.checked=!!t.completed;cb.onchange=()=>{t.completed=cb.checked;save();render()};const text=document.createElement('div');text.className='scheduleText';const nm=document.createElement('div');nm.className='scheduleName';nm.textContent=(x.depth?'↳ ':'')+t.title;const meta=document.createElement('div');meta.className='scheduleMeta';meta.textContent=`${minutesToTime(start)} - ${minutesToTime(start+duration)}（${duration}分）`;text.append(nm,meta);const acts=document.createElement('div');acts.className='scheduleActions';const pri=document.createElement('button');pri.className='scheduleMini'+(p.priority==='high'?' high':'');pri.textContent=p.priority==='high'?'★':'☆';pri.title='高優先度';pri.onclick=()=>{p.priority=p.priority==='high'?'':'high';save();render()};const edit=document.createElement('button');edit.className='scheduleMini';edit.textContent='✎';edit.title='タスク編集';edit.onclick=()=>openDlg(t.id);const clear=document.createElement('button');clear.className='scheduleMini';clear.textContent='×';clear.title='予定から外す（タスクは削除しません）';clear.onclick=()=>{p.time='';save();render()};acts.append(pri,edit,clear);const resize=document.createElement('div');resize.className='resizeHandle';resize.title='ドラッグして所要時間を変更';inner.append(drag,cb,text,acts);card.append(inner,resize);enablePlannerDrag(drag,card,t,meta);enablePlannerResize(resize,card,t,meta);return card}
function enablePlannerDrag(handle,card,t,meta){handle.onpointerdown=e=>{e.preventDefault();e.stopPropagation();const p=getTodayPlan(t,true),start0=timeToMinutes(p.time)??PLAN_START,duration=Math.max(15,Number(p.duration)||60),y0=e.clientY;handle.setPointerCapture(e.pointerId);card.style.zIndex='20';const move=ev=>{const d=(ev.clientY-y0)/PLAN_HOUR_PX*60,m=Math.max(PLAN_START,Math.min(PLAN_END-duration,snap15(start0+d)));card.style.top=`${plannerY(m)}px`;meta.textContent=`${minutesToTime(m)} - ${minutesToTime(m+duration)}（${duration}分）`;handle._m=m};const up=ev=>{handle.releasePointerCapture?.(ev.pointerId);handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',up);handle.removeEventListener('pointercancel',up);const m=Number.isFinite(handle._m)?handle._m:start0;p.time=minutesToTime(m);delete handle._m;save();render()};handle.addEventListener('pointermove',move);handle.addEventListener('pointerup',up);handle.addEventListener('pointercancel',up)}}
function enablePlannerResize(handle,card,t,meta){handle.onpointerdown=e=>{e.preventDefault();e.stopPropagation();const p=getTodayPlan(t,true),start=timeToMinutes(p.time)??PLAN_START,d0=Math.max(15,Number(p.duration)||60),y0=e.clientY;handle.setPointerCapture(e.pointerId);card.style.zIndex='20';const move=ev=>{const delta=(ev.clientY-y0)/PLAN_HOUR_PX*60,d=Math.max(15,Math.min(PLAN_END-start,snap15(d0+delta)));card.style.height=`${Math.max(28,d/60*PLAN_HOUR_PX)}px`;meta.textContent=`${minutesToTime(start)} - ${minutesToTime(start+d)}（${d}分）`;handle._d=d};const up=ev=>{handle.releasePointerCapture?.(ev.pointerId);handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',up);handle.removeEventListener('pointercancel',up);p.duration=Number.isFinite(handle._d)?handle._d:d0;delete handle._d;save();render()};handle.addEventListener('pointermove',move);handle.addEventListener('pointerup',up);handle.addEventListener('pointercancel',up)}}
'''
          assert render_anchor in s
          s=s.replace(render_anchor,planner_js+render_anchor,1)

          assert "KEY='task-manager-v1'" in s
          p.write_text(s,encoding='utf-8')
          script=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/app.js').write_text(script,encoding='utf-8')
          PY
          node --check /tmp/app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add draggable daily timeline planner"
          git push
