name: Equalize Today planner columns
on:
  push:
    paths:
      - '.github/workflows/equal-today-columns.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make unplanned and schedule columns equal width
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='.todayPlanner{max-width:1200px;margin:0 auto;padding:18px 18px 80px;background:#fff}.plannerBody{display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr);gap:14px;align-items:start}'
          new='.todayPlanner{max-width:980px;margin:0 auto;padding:18px 18px 80px;background:#fff}.plannerBody{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}'
          if old not in s:
            raise SystemExit('layout anchor missing')
          s=s.replace(old,new,1)
          assert "KEY='task-manager-v1'" in s
          p.write_text(s,encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          assert m
          Path('/tmp/app.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make Today planner columns equal width"
          git push
