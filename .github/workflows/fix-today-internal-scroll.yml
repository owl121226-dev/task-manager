name: Fix Today internal scroll
on:
  push:
    paths:
      - '.github/workflows/fix-today-internal-scroll.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep Today planner on one screen with internal scrolling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          anchor='.timeline{position:relative;min-height:var(--row);'
          if anchor not in s:
            raise SystemExit('css insertion anchor missing')
          css=""".wrap.todayFixed{overflow:hidden}.wrap.todayFixed .board,.wrap.todayFixed #rows{height:100%;min-height:0}.wrap.todayFixed .bottomSpacer{display:none}.wrap.todayFixed .todayPlanner{height:100%;min-height:0;padding:14px 18px;display:flex;flex-direction:column}.wrap.todayFixed .plannerTitleRow{flex:none}.wrap.todayFixed .plannerBody{flex:1;min-height:0;overflow:hidden;align-items:stretch}.wrap.todayFixed .scheduleWrap{height:100%;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}.wrap.todayFixed .unplannedBox{height:100%;min-height:0;max-height:none;overflow-y:auto;overscroll-behavior:contain}@media(max-width:820px){.wrap.todayFixed .todayPlanner{padding:10px 8px}.wrap.todayFixed .plannerBody{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(110px,32%);gap:8px}.wrap.todayFixed .scheduleWrap{grid-column:1;grid-row:1}.wrap.todayFixed .unplannedBox{grid-column:1;grid-row:2;height:100%;max-height:none}}\n"""
          s=s.replace(anchor,css+anchor,1)

          old="function render(){renderHead();const todayMode=state.filter==='today';$('board').classList.toggle('todayPlannerMode',todayMode);"
          new="function render(){renderHead();const todayMode=state.filter==='today';$('board').classList.toggle('todayPlannerMode',todayMode);$('wrap').classList.toggle('todayFixed',todayMode);"
          if old not in s:
            raise SystemExit('render anchor missing')
          s=s.replace(old,new,1)

          assert "KEY='task-manager-v1'" in s
          p.write_text(s,encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          assert m
          Path('/tmp/app.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use internal scroll for Today planner"
          git push
