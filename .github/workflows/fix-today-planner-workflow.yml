name: Fix Today planner workflow
on:
  push:
    paths:
      - '.github/workflows/fix-today-planner-workflow.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix regex and retrigger planner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/today-planner.yml')
          lines=p.read_text(encoding='utf-8').splitlines()
          out=[]
          changed=False
          for line in lines:
              if 'm=re.search(' in line:
                  indent=line[:len(line)-len(line.lstrip())]
                  line=indent+"m=re.search(r'<script>([\\s\\S]*?)</script>',s)"
                  changed=True
              out.append(line)
          assert changed
          p.write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/today-planner.yml
          git commit -m "Fix Today planner syntax extraction"
          git push
