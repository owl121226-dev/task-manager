name: Update task date format
on:
  push:
    paths:
      - '.github/workflows/date-format-storage.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update date parsing and storage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace('placeholder="MM/DD" maxlength="5" id="start"','placeholder="MM/DD または YYYY/MM/DD" maxlength="10" id="start"',1)
          s=s.replace('placeholder="MM/DD" maxlength="5" id="end"','placeholder="MM/DD または YYYY/MM/DD" maxlength="10" id="end"',1)

          old_load="function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x){state.tasks=x.tasks||[];state.collapsed=x.collapsed||{}}}catch(e){}}"
          new_load="function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x){state.tasks=(x.tasks||[]).map(t=>({...t,start:normalizeStored(t.start),end:normalizeStored(t.end)}));state.collapsed=x.collapsed||{}}}catch(e){}}"
          assert old_load in s
          s=s.replace(old_load,new_load,1)

          old_dates="function iso(d){return d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`:''}\nfunction date(s){if(!s)return null;const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}\nfunction short(s){const d=date(s);return d?`${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`:''}\nfunction parseMD(v,base=''){v=(v||'').trim();if(!v)return '';if(/^\\d{4}$/.test(v))v=v.slice(0,2)+'/'+v.slice(2);const m=v.match(/^(\\d{1,2})\\/(\\d{1,2})$/);if(!m)return null;const mo=Number(m[1]),da=Number(m[2]),old=date(base),y=old?old.getFullYear():state.view.getFullYear(),d=new Date(y,mo-1,da);if(d.getFullYear()!==y||d.getMonth()!==mo-1||d.getDate()!==da)return null;return iso(d)}"
          new_dates="function iso(d){return d?`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`:''}\nfunction date(s){if(!s)return null;const m=String(s).match(/^(\\d{4})[-\\/](\\d{1,2})[-\\/](\\d{1,2})$/);if(!m)return null;const y=Number(m[1]),mo=Number(m[2]),da=Number(m[3]),d=new Date(y,mo-1,da);return d.getFullYear()===y&&d.getMonth()===mo-1&&d.getDate()===da?d:null}\nfunction normalizeStored(s){const d=date(s);return d?iso(d):''}\nfunction short(s){const d=date(s);return d?`${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`:''}\nfunction parseMD(v,base=''){v=(v||'').trim();if(!v)return '';if(/^\\d{4}$/.test(v))v=v.slice(0,2)+'/'+v.slice(2);if(/^\\d{8}$/.test(v))v=v.slice(0,4)+'/'+v.slice(4,6)+'/'+v.slice(6);let y,mo,da,m=v.match(/^(\\d{4})[\\/-](\\d{1,2})[\\/-](\\d{1,2})$/);if(m){y=Number(m[1]);mo=Number(m[2]);da=Number(m[3])}else{m=v.match(/^(\\d{1,2})\\/(\\d{1,2})$/);if(!m)return null;mo=Number(m[1]);da=Number(m[2]);const old=date(base);y=old?old.getFullYear():state.view.getFullYear()}const d=new Date(y,mo-1,da);if(d.getFullYear()!==y||d.getMonth()!==mo-1||d.getDate()!==da)return null;return iso(d)}"
          assert old_dates in s
          s=s.replace(old_dates,new_dates,1)

          s=s.replace("i.maxLength=5;i.placeholder='MM/DD';i.value=short(t[k]);i.title='MM/DDで直接入力'","i.maxLength=10;i.placeholder='MM/DD';i.value=short(t[k]);i.title='MM/DD または YYYY/MM/DDで直接入力'",1)
          s=s.replace("notice('日付はMM/DDで入力してください')","notice('日付はMM/DDまたはYYYY/MM/DDで入力してください')")

          # Ensure storage key remains unchanged.
          assert "KEY='task-manager-v1'" in s
          # Ensure full-year dates are accepted and display stays MM/DD.
          assert "YYYY/MM/DD" in s
          assert "function short(s)" in s
          p.write_text(s,encoding='utf-8')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          assert m
          Path('/tmp/app.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Store dates as YYYY/MM/DD and display MM/DD"
          git push
