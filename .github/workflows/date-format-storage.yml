name: Persist migrated task dates
on:
  push:
    paths:
      - '.github/workflows/date-format-storage.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Persist normalized dates on load
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x){state.tasks=(x.tasks||[]).map(t=>({...t,start:normalizeStored(t.start),end:normalizeStored(t.end)}));state.collapsed=x.collapsed||{}}}catch(e){}}"
          new="function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x){state.tasks=(x.tasks||[]).map(t=>({...t,start:normalizeStored(t.start),end:normalizeStored(t.end)}));state.collapsed=x.collapsed||{};save()}}catch(e){}}"
          assert old in s
          s=s.replace(old,new,1)
          assert "KEY='task-manager-v1'" in s
          p.write_text(s,encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          assert m
          Path('/tmp/app.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Persist normalized YYYY/MM/DD dates on load"
          git push
