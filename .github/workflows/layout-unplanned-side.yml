name: Put unplanned beside schedule
on:
  push:
    paths:
      - '.github/workflows/layout-unplanned-side.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move unplanned tasks beside schedule
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old='.todayPlanner{max-width:980px;margin:0 auto;padding:18px 18px 80px;background:#fff}'
          new='.todayPlanner{max-width:1200px;margin:0 auto;padding:18px 18px 80px;background:#fff}.plannerBody{display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr);gap:14px;align-items:start}.plannerBody.noUnplanned{grid-template-columns:1fr}'
          assert old in s
          s=s.replace(old,new,1)

          old='.unplannedBox{border:1px solid #e1e5ea;border-radius:10px;background:#fafbfc;padding:10px 12px;margin-bottom:14px}'
          new='.unplannedBox{border:1px solid #e1e5ea;border-radius:10px;background:#fafbfc;padding:10px 12px;margin-bottom:0;max-height:704px;overflow:auto}'
          assert old in s
          s=s.replace(old,new,1)

          old='.unplannedList{display:flex;flex-wrap:wrap;gap:7px}'
          new='.unplannedList{display:flex;flex-direction:column;gap:7px}'
          assert old in s
          s=s.replace(old,new,1)

          old='.unplannedItem{display:flex;align-items:center;gap:6px;max-width:100%;border:1px solid #dfe3e8;background:#fff;border-radius:8px;padding:6px 7px;font-size:12px}'
          new='.unplannedItem{display:flex;align-items:center;gap:6px;width:100%;max-width:100%;border:1px solid #dfe3e8;background:#fff;border-radius:8px;padding:6px 7px;font-size:12px}'
          assert old in s
          s=s.replace(old,new,1)

          old='.unplannedItem .uName{max-width:290px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}'
          new='.unplannedItem .uName{flex:1;min-width:0;max-width:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}'
          assert old in s
          s=s.replace(old,new,1)

          old='@media(max-width:820px){.todayPlanner{padding:12px 8px 70px}.plannerHint{display:none}.scheduleGrid{margin-left:56px}'
          new='@media(max-width:820px){.todayPlanner{padding:12px 8px 70px}.plannerBody{grid-template-columns:1fr}.unplannedBox{max-height:none;margin-bottom:0}.plannerHint{display:none}.scheduleGrid{margin-left:56px}'
          assert old in s
          s=s.replace(old,new,1)

          old='wrap.appendChild(title);const unplanned=list.filter'
          new="wrap.appendChild(title);const body=document.createElement('div');body.className='plannerBody';wrap.appendChild(body);const unplanned=list.filter"
          assert old in s
          s=s.replace(old,new,1)

          old='box.append(head,ul);wrap.appendChild(box)}const sw=document.createElement'
          new='box.append(head,ul);body.appendChild(box)}const sw=document.createElement'
          assert old in s
          s=s.replace(old,new,1)

          old='sw.appendChild(grid);wrap.appendChild(sw);rows.appendChild(wrap)}'
          new="sw.appendChild(grid);if(!unplanned.length)body.classList.add('noUnplanned');body.appendChild(sw);rows.appendChild(wrap)}"
          assert old in s
          s=s.replace(old,new,1)

          assert "KEY='task-manager-v1'" in s
          p.write_text(s,encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          assert m
          Path('/tmp/app.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Place unplanned tasks beside Today schedule"
          git push
