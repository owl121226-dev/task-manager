name: Remove inline insert and clear subtask dates
on:
  push:
    paths:
      - '.github/workflows/remove-inline-insert.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old="const title=document.createElement('div');title.className='title';title.style.paddingLeft=`${depth*22+8}px`;"
          new="const title=document.createElement('div');title.className='title';title.style.paddingLeft=`${depth*22}px`;"
          assert old in s
          s=s.replace(old,new,1)

          old="const insert=mini('＋↓','この直後に同じ階層のタスクを追加',()=>openDlg(null,t.parentId||null,t.id),'insert');\nconst nm=document.createElement('span');nm.className='name';nm.textContent=t.title;nm.title=t.title;\ntitle.append(insert,drag,cb,nm,tog);"
          new="const nm=document.createElement('span');nm.className='name';nm.textContent=t.title;nm.title=t.title;\ntitle.append(drag,cb,nm,tog);"
          assert old in s
          s=s.replace(old,new,1)

          old="$ ('start')"
          # Keep this guard inert; replacements below are exact.

          old="$('start').value=short(t?.start||p?.start||'');$('end').value=short(t?.end||p?.end||'');"
          new="$('start').value=short(t?.start||'');$('end').value=short(t?.end||'');"
          assert old in s
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove inline insert and leave subtask dates blank"
          git push
