name: Configure three task groups
on:
  push:
    paths:
      - '.github/workflows/configure-three-groups.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure groups and completion behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old='.groupBox .row:last-child{border-bottom:0}.groupSpacer{height:var(--row);background:#fff}.row:hover .left'
          new='.groupBox .row:last-child{border-bottom:0}.groupSpacer{height:var(--row);background:#fff}.groupLabel{height:var(--row);display:grid;grid-template-columns:var(--left) calc(var(--days)*var(--day));background:#fff}.groupLabelLeft{position:sticky;left:0;z-index:13;background:#fff;border-right:1px solid var(--line);display:grid;grid-template-columns:1fr 92px 92px 118px;align-items:center}.groupLabelLeft>div{height:100%;display:flex;align-items:center;padding:0 8px;border-right:1px solid #f0f2f4;font-size:12px;font-weight:650;color:#5f6772}.groupLabelRight{background:#fff}.row:hover .left'
          assert old in s
          s=s.replace(old,new,1)

          old='.field input,.field select{border:1px solid #d8dde3;border-radius:8px;padding:9px 10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}'
          new='.field input,.field select{border:1px solid #d8dde3;border-radius:8px;padding:9px 10px}.keepField{display:flex;align-items:center;gap:8px;font-size:12px;color:#59616c}.keepField input{width:17px;height:17px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}'
          assert old in s
          s=s.replace(old,new,1)

          old='<div class="field"><label>分類</label><select id="category"><option value="normal">通常</option><option value="future">今後</option><option value="someday">時間がある時</option></select></div><div class="dlgActions">'
          new='<div class="field"><label>分類</label><select id="category"><option value="top">タスク</option><option value="future">予定</option><option value="normal">経理</option><option value="someday">時間がある時</option></select></div><label class="keepField"><input type="checkbox" id="keepCompleted">完了しても完了タブへ移動しない</label><div class="dlgActions">'
          assert old in s
          s=s.replace(old,new,1)

          old="const state={tasks:[],collapsed:{},spacers:[],spacersInitialized:false,filter:'all',view:new Date(new Date().getFullYear(),new Date().getMonth(),1)};"
          new="const state={tasks:[],collapsed:{},spacers:[],spacersInitialized:false,groupingInitialized:false,filter:'all',view:new Date(new Date().getFullYear(),new Date().getMonth(),1)};"
          assert old in s
          s=s.replace(old,new,1)

          old="function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x){state.tasks=x.tasks||[];state.collapsed=x.collapsed||{};state.spacers=Array.isArray(x.spacers)?x.spacers:[];state.spacersInitialized=!!x.spacersInitialized}}catch(e){}}"
          new="function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x){state.tasks=x.tasks||[];state.collapsed=x.collapsed||{};state.spacers=Array.isArray(x.spacers)?x.spacers:[];state.spacersInitialized=!!x.spacersInitialized;state.groupingInitialized=!!x.groupingInitialized}}catch(e){}}"
          assert old in s
          s=s.replace(old,new,1)

          old="function save(){localStorage.setItem(KEY,JSON.stringify({tasks:state.tasks,collapsed:state.collapsed,spacers:state.spacers,spacersInitialized:state.spacersInitialized}))}"
          new="function save(){localStorage.setItem(KEY,JSON.stringify({tasks:state.tasks,collapsed:state.collapsed,spacers:state.spacers,spacersInitialized:state.spacersInitialized,groupingInitialized:state.groupingInitialized}))}"
          assert old in s
          s=s.replace(old,new,1)

          old="function match(t){const now=day(new Date());if(state.filter==='completed')return !!t.completed;if(t.completed)return false;if(state.filter==='all')return t.category!=='someday';if(state.filter==='someday')return t.category==='someday';if(state.filter==='today'){if(t.category==='someday')return false;const due=date(t.end)||date(t.start);return intersects(t,now,now)||(due&&due<=now)}return true}"
          new="function match(t){const now=day(new Date()),keep=!!t.keepCompleted;if(state.filter==='completed')return !!t.completed&&!keep;if(t.completed&&!keep)return false;if(state.filter==='all')return t.category!=='someday';if(state.filter==='someday')return t.category==='someday';if(state.filter==='today'){if(t.category==='someday')return false;const due=date(t.end)||date(t.start);return intersects(t,now,now)||(due&&due<=now)}return true}"
          assert old in s
          s=s.replace(old,new,1)

          old="function normTitle(s){return String(s||'').replace(/[\\s\\u3000]+/g,'')}\nfunction initFixedSpacers()"
          new="function normTitle(s){return String(s||'').replace(/[\\s\\u3000]+/g,'')}\nconst TOP_GROUP_TITLES=new Set(['当座確認','電債入金確認','売掛金照合','メトリー確認','水道局入札準備']);\nconst KEEP_COMPLETED_TITLES=new Set(['当座確認','電債入金確認','売掛金照合']);\nfunction initThreeGroups(){if(state.groupingInitialized)return;for(const t of state.tasks){const n=normTitle(t.title);if(TOP_GROUP_TITLES.has(n))t.category='top';if(KEEP_COMPLETED_TITLES.has(n))t.keepCompleted=true}state.groupingInitialized=true;save()}\nfunction rootTask(t){let r=t,guard=0;while(r?.parentId&&guard++<50){const p=state.tasks.find(x=>x.id===r.parentId);if(!p)break;r=p}return r||t}\nfunction taskGroup(t){const r=rootTask(t);if(r.category==='top')return 'top';if(r.category==='future')return 'schedule';return 'accounting'}\nfunction makeGroupLabel(text){const el=document.createElement('div');el.className='groupLabel';const left=document.createElement('div');left.className='groupLabelLeft';left.innerHTML=`<div>${text}</div><div></div><div></div><div></div>`;const right=document.createElement('div');right.className='groupLabelRight';el.append(left,right);return el}\nfunction initFixedSpacers()"
          assert old in s
          s=s.replace(old,new,1)

          old="function render(){renderHead();$('rows').innerHTML='';const list=visible();if(!list.length){$('rows').innerHTML='<div class=\"empty\">該当するタスクはありません。</div>';return}if(state.filter==='all'){const fixed=new Set(state.spacers);let group=document.createElement('div');group.className='groupBox';for(const x of list){group.appendChild(row(x.t,x.depth,x.kids));if(fixed.has(x.t.id)){if(group.children.length)$('rows').appendChild(group);const sp=document.createElement('div');sp.className='groupSpacer';$('rows').appendChild(sp);group=document.createElement('div');group.className='groupBox'}}if(group.children.length)$('rows').appendChild(group)}else{for(const x of list)$('rows').appendChild(row(x.t,x.depth,x.kids))}}"
          new="function render(){renderHead();$('rows').innerHTML='';const list=visible();if(!list.length){$('rows').innerHTML='<div class=\"empty\">該当するタスクはありません。</div>';return}if(state.filter==='all'){const buckets={top:[],schedule:[],accounting:[]};for(const x of list)buckets[taskGroup(x.t)].push(x);const defs=[['top',''],['schedule','予定'],['accounting','経理']];for(const [key,label] of defs){if(label)$('rows').appendChild(makeGroupLabel(label));const items=buckets[key];if(!items.length)continue;const group=document.createElement('div');group.className='groupBox';for(const x of items)group.appendChild(row(x.t,x.depth,x.kids));$('rows').appendChild(group)}}else{for(const x of list)$('rows').appendChild(row(x.t,x.depth,x.kids))}}"
          assert old in s
          s=s.replace(old,new,1)

          old="function openDlg(id=null,pid=null,afterId=null){const t=id?state.tasks.find(x=>x.id===id):null,p=pid?state.tasks.find(x=>x.id===pid):null;$('editId').value=id||'';$('parentId').value=pid||'';$('insertAfterId').value=afterId||'';$('dlgTitle').textContent=t?'タスクを編集':afterId?'この直後にタスクを追加':pid?'サブタスクを追加':'タスクを追加';$('title').value=t?.title||'';$('start').value=short(t?.start||p?.start||'');$('end').value=short(t?.end||p?.end||'');$('category').value=t?.category||p?.category||'normal';$('dlg').showModal();setTimeout(()=>$('title').focus(),20)}"
          new="function openDlg(id=null,pid=null,afterId=null){const t=id?state.tasks.find(x=>x.id===id):null,p=pid?state.tasks.find(x=>x.id===pid):null;$('editId').value=id||'';$('parentId').value=pid||'';$('insertAfterId').value=afterId||'';$('dlgTitle').textContent=t?'タスクを編集':afterId?'この直後にタスクを追加':pid?'サブタスクを追加':'タスクを追加';$('title').value=t?.title||'';$('start').value=short(t?.start||p?.start||'');$('end').value=short(t?.end||p?.end||'');$('category').value=t?.category||p?.category||'normal';$('keepCompleted').checked=!!t?.keepCompleted;$('dlg').showModal();setTimeout(()=>$('title').focus(),20)}"
          assert old in s
          s=s.replace(old,new,1)

          old="if(id){Object.assign(old,{title,start,end,category:$('category').value})}else{const task={id:uid(),title,start,end,completed:false,parentId:pid,category:$('category').value,order:nextOrder(pid)};"
          new="if(id){Object.assign(old,{title,start,end,category:$('category').value,keepCompleted:$('keepCompleted').checked})}else{const task={id:uid(),title,start,end,completed:false,parentId:pid,category:$('category').value,keepCompleted:$('keepCompleted').checked,order:nextOrder(pid)};"
          assert old in s
          s=s.replace(old,new,1)

          old="load();initFixedSpacers();render();setTimeout(scrollToday,20);"
          new="load();initThreeGroups();render();setTimeout(scrollToday,20);"
          assert old in s
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Organize tasks into three named groups"
          git push
