name: Apply planner scroll fix
on:
  push:
    paths:
      - '.github/workflows/apply-planner-scroll-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_planner_scroll.py
      - run: node --check /tmp/app.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix planner drag scrolling and preserve scroll position"
          git push
