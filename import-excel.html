function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,9)}
function sig(t){return [t.title||'',t.start||'',t.end||'',t.category||'normal'].join('|')}
try{
 const saved=JSON.parse(localStorage.getItem(KEY)||'{"tasks":[],"collapsed":{}}');
 let tasks=Array.isArray(saved.tasks)?saved.tasks:[],collapsed=saved.collapsed||{};
 const starter=tasks.find(t=>!t.parentId&&t.title==='サンプル：入札準備');
 if(starter){const ids=new Set([starter.id]);let changed=true;while(changed){changed=false;for(const t of tasks)if(t.parentId&&ids.has(t.parentId)&&!ids.has(t.id)){ids.add(t.id);changed=true}}tasks=tasks.filter(t=>!ids.has(t.id))}
 const existing=new Set(tasks.map(sig));let order=Math.max(0,...tasks.filter(t=>!t.parentId).map(t=>t.order||0))+10,added=0;
 for(const [title,start,end,done,category,section] of data){const t={title,start,end,completed:!!done,parentId:null,category,excelSection:section};if(existing.has(sig(t)))continue;tasks.push({...t,id:uid(),order});order+=10;existing.add(sig(t));added++}
 localStorage.setItem(KEY,JSON.stringify({tasks,collapsed}));localStorage.setItem(IMPORT,'1');
 document.getElementById('msg').className='ok';document.getElementById('msg').textContent=`取り込み完了：${added}件を追加しました（Excel全51件、重複は追加しません）。`;
}catch(e){document.getElementById('msg').className='err';document.getElementById('msg').textContent='取り込みに失敗しました: '+e.message}
</script></body></html>
